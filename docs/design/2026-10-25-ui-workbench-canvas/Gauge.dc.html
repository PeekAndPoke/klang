<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gauge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="{{ aria }}" style="position: relative; width: {{ px }}; height: {{ px }}; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #1a1d23 0%, #0b0d10 70%); box-shadow: {{ glow }}">
  <svg width="100%" height="100%" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="48" fill="none" stroke="url(#gaugeBezel)" stroke-width="3"></circle>
    <defs>
      <linearGradient id="gaugeBezel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d9dde3"></stop>
        <stop offset="55%" stop-color="#7d838d"></stop>
        <stop offset="100%" stop-color="#3a3f48"></stop>
      </linearGradient>
    </defs>
    <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="11">
      <line x1="{{ t.x1 }}" y1="{{ t.y1 }}" x2="{{ t.x2 }}" y2="{{ t.y2 }}" stroke="{{ t.c }}" stroke-width="{{ t.w }}"></line>
    </sc-for>
    <path d="{{ track }}" fill="none" stroke="#2c313a" stroke-width="5" stroke-linecap="round"></path>
    <path d="{{ arc }}" fill="none" stroke="{{ color }}" stroke-width="5" stroke-linecap="round"></path>

    <sc-if value="{{ iconCyl }}" hint-placeholder-val="{{ false }}">
      <g transform="translate(41 24)" fill="none" stroke="#abb2bf" stroke-width="1.6"><rect x="3" y="0" width="12" height="15" rx="2"></rect><line x1="0" y1="4" x2="3" y2="4"></line><line x1="15" y1="4" x2="18" y2="4"></line><line x1="6" y1="15" x2="6" y2="18"></line><line x1="12" y1="15" x2="12" y2="18"></line></g>
    </sc-if>
    <sc-if value="{{ iconHeat }}" hint-placeholder-val="{{ false }}">
      <path transform="translate(41 22)" d="M9 0 C10 5 15 7 15 13 A6 6 0 0 1 3 13 C3 9 6 8 6 4 C7 6 8 7 9 0 Z" fill="none" stroke="#abb2bf" stroke-width="1.6" stroke-linejoin="round"></path>
    </sc-if>
    <sc-if value="{{ iconVoices }}" hint-placeholder-val="{{ false }}">
      <g transform="translate(40 24)" fill="none" stroke="#abb2bf" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="6" x2="2" y2="12"></line><line x1="6.5" y1="2" x2="6.5" y2="16"></line><line x1="11" y1="4" x2="11" y2="14"></line><line x1="15.5" y1="7" x2="15.5" y2="11"></line><line x1="20" y1="5" x2="20" y2="13"></line></g>
    </sc-if>

    <line x1="50" y1="50" x2="{{ nx }}" y2="{{ ny }}" stroke="#EDEFF2" stroke-width="2.4" stroke-linecap="round"></line>
    <circle cx="50" cy="50" r="5" fill="url(#gaugeBezel)" stroke="#000" stroke-width="0.8"></circle>
    <sc-if value="{{ hasValue }}" hint-placeholder-val="{{ true }}">
      <text x="50" y="72" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#D7DADF">{{ value }}</text>
    </sc-if>
  </svg>
  <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: -20px; right: -20px; top: 100%; margin-top: 6px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #abb2bf">{{ label }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":90,"min":40,"max":200},"frac":{"editor":"range","default":0.4,"min":0,"max":1,"step":0.01},"value":{"editor":"text","default":"38%"},"label":{"editor":"text","default":""},"icon":{"editor":"enum","options":["none","cylinders","heat","voices"],"default":"heat"},"color":{"editor":"color","default":"#e5c07b"},"online":{"editor":"boolean","default":true},"danger":{"editor":"boolean","default":false},"$preview":{"width":90,"height":90}}'>
class Component extends DCLogic {
  arcPath(frac) {
    const a0 = 135 * Math.PI / 180;
    const sweep = Math.max(0.001, frac) * 270;
    const a1 = a0 + sweep * Math.PI / 180;
    const r = 40;
    const p = (a) => (50 + r * Math.cos(a)).toFixed(2) + ' ' + (50 + r * Math.sin(a)).toFixed(2);
    return 'M ' + p(a0) + ' A ' + r + ' ' + r + ' 0 ' + (sweep > 180 ? 1 : 0) + ' 1 ' + p(a1);
  }
  renderVals() {
    const size = this.props.size ?? 90;
    const frac = this.props.frac ?? 0.4;
    const online = this.props.online ?? true;
    const danger = this.props.danger ?? false;
    const icon = this.props.icon ?? 'heat';
    const color = danger ? '#e06c75' : (this.props.color ?? '#e5c07b');
    const ticks = [];
    for (let i = 0; i <= 10; i++) {
      const a = (135 + i * 27) * Math.PI / 180;
      const major = i % 5 === 0;
      const r1 = 46, r2 = major ? 39 : 42;
      ticks.push({
        x1: (50 + r1 * Math.cos(a)).toFixed(2), y1: (50 + r1 * Math.sin(a)).toFixed(2),
        x2: (50 + r2 * Math.cos(a)).toFixed(2), y2: (50 + r2 * Math.sin(a)).toFixed(2),
        c: i >= 9 ? '#e06c75' : '#8a919e', w: major ? 1.8 : 1,
      });
    }
    const shown = online ? frac : 0;
    const an = (135 + shown * 270) * Math.PI / 180;
    const glow = !online ? 'inset 0 2px 4px rgba(0,0,0,0.8)'
      : (danger ? '0 0 14px rgba(224,108,117,0.65), inset 0 2px 4px rgba(0,0,0,0.8)' : '0 0 12px rgba(92,124,188,0.5), inset 0 2px 4px rgba(0,0,0,0.8)');
    const label = this.props.label ?? '';
    const value = this.props.value ?? '';
    return {
      px: size + 'px',
      aria: (label || icon) + ': ' + (online ? value : 'offline'),
      glow: glow,
      ticks: ticks,
      track: this.arcPath(1),
      arc: this.arcPath(shown),
      color: online ? color : '#2c313a',
      nx: (50 + 32 * Math.cos(an)).toFixed(2), ny: (50 + 32 * Math.sin(an)).toFixed(2),
      iconCyl: icon === 'cylinders', iconHeat: icon === 'heat', iconVoices: icon === 'voices',
      hasValue: online && value !== '',
      value: value,
      hasLabel: label !== '',
      label: label,
    };
  }
}
</script>
</body>
</html>
