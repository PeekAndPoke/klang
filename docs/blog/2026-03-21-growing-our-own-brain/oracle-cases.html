<title>The oracle suite, case by case</title>
<!--
  Figure for docs/blog/2026-03-21-growing-our-own-brain/index.md: a data view of the differential-testing suite as it stood
  on 2026-03-21 (git b1bcc0e3, the last commit of that day). No row is invented or drawn at random; every row comes from:

  - sprudel/src/jvmTest/kotlin/compat/JsCompatTestData.kt at b1bcc0e3: the 627 pattern cases (563 written out, 64 drawn at
    random by the suite on every run: 3 of the 36 Euclidean (p,s) and 61 of the 612 (p,s,r), lines 215 to 232), the skip
    flags and the comments above them, the rules: Slow & Fast (275-276), Binary and BinaryN (368-371), the continuous
    block (636-641), Round with continuous (809-810), every case (848-852).
  - sprudel/src/jvmTest/kotlin/compat/JsCompatTestSongs.kt at b1bcc0e3: the 15 songs, the rules for all of them (219-223).
  - sprudel/src/jvmTest/kotlin/compat/JsCompatTests.kt at b1bcc0e3: test names "Pattern N" and "Song N", a skipped case is
    not enabled (41, 48); the five verdicts (27-33); 32 cycles (80); onsets only (84, 88); counts must match (101);
    ignored, recovered, different (169-175); exact (178); 1e-3 (188); note names ignoring case (194-197).
  - docs/tasks-archive/2026-02/20260201-test-failure-investigation.md (added in cb0f9da2, 2026-02-01 15:48): 103 of 2476
    tests failing after the part/whole refactor, in 11 categories with their counts and the cases they name. The record
    numbers the patterns of its own run; cases are matched to this suite by name, and by code where the name is gone.
  - docs/tasks-archive/2026-01/20260131-strudel-part-whole-refactoring.md (eff60905, 2026-01-31): 2374 of 2476 passing.
  - git history of the two data files (98 commits up to 2026-03-21): the day a case's code first appears, meaning the first
    commit whose file text holds its code as a whole string literal.
  The lane names and the six skip reasons are our grouping of the source's section comments and skip comments.
-->

<style>
/* Tokens copied from the blog page (console/blog/blog.css), which are the UI palette of KlangLookAndFeel. Dark only. */
:root {
    color-scheme: dark;
    --void: #12131C;
    --paper: #191C22;
    --surface: #21252B;
    --surface-2: #2C313A;
    --ink: #D7DADF;
    --muted: #ABB2BF;
    --dim: #8A92A2;
    --faint: #5C6370;
    --rule: #353A42;
    --spark: #D19A66;
    --signal: #56B6C2;
    --signal-bg: #1A2A30;
    --gold: #E8B84B;
    /* the UI's five-step status scale, used for the five verdicts and the red record */
    --s-excellent: #56B6C2;
    --s-good: #98C379;
    --s-moderate: #E5C07B;
    --s-warning: #D19A66;
    --s-critical: #E06C75;

    --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --f-body: Charter, "Bitstream Charter", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --f-mono: "Share Tech Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

    --cs: 9px;   /* one case cell */
    --cg: 2px;   /* gap between cells */
}

* { box-sizing: border-box; }
html { background: var(--paper); }
body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--f-mono);
    font-size: 12px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
.fig { display: flow-root; margin: 0; padding: 2px 0 6px; color: var(--muted); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; }
input { font: inherit; }
:focus-visible { outline: 2px solid var(--spark); outline-offset: 1px; }
.no-js .js-only { display: none !important; }
.js .nojs-only { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- readout bar ---------- */
.bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 3px 14px;
    padding: 0 0 5px;
    margin: 0 0 7px;
    border-bottom: 1px solid var(--rule);
}
.readout { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 1px 6px; color: var(--muted); }
.readout .shown { margin-right: 8px; }
.rt { padding: 0 7px; line-height: 20px; border: 1px solid var(--rule); background: var(--surface); }
.rt:hover { border-color: var(--gold); color: var(--ink); }
.rt[aria-pressed="true"] { border-color: var(--gold); background: rgba(232, 184, 75, 0.11); color: var(--ink); }
.readout .red { margin-left: 8px; }
.readout .chip { margin-left: auto; }
.no-js .mk { pointer-events: none; }
.no-js .rt { pointer-events: none; border-color: transparent; background: none; padding: 0 4px; }
.readout b { font-weight: 400; color: var(--ink); }
.readout .shown b { color: var(--gold); }
.readout .red b { color: var(--s-critical); }
.chip {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--rule);
    padding: 1px 9px;
    line-height: 1.5;
}
.chip:hover { border-color: var(--gold); color: var(--ink); }
.chip[disabled] { opacity: .4; cursor: default; }
.chip[disabled]:hover { border-color: var(--rule); color: var(--muted); }

/* ---------- timeline ---------- */
.time { margin: 0 0 8px; }
.tl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; margin: 0 0 3px; }
.tl-head label { color: var(--dim); }
.tl-head output { color: var(--gold); }
.tl-note { color: var(--muted); min-height: 1.4em; }
.tl-note b { font-weight: 400; color: var(--s-critical); }
.track { position: relative; height: 34px; border-bottom: 1px solid var(--rule); }
.track svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.spark-area { fill: rgba(86, 182, 194, 0.22); stroke: none; }
.spark-line { fill: none; stroke: var(--signal); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.spark-future { fill: var(--paper); opacity: .62; }
.spark-tick { stroke: var(--rule); stroke-width: 1; vector-effect: non-scaling-stroke; }
.spark-tick.red { stroke: var(--s-critical); stroke-width: 1.5; }
.spark-ref { font-size: 10px; fill: var(--dim); }
.track input[type="range"] {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    margin: 0; padding: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: ew-resize;
}
.track input[type="range"]::-webkit-slider-runnable-track { height: 34px; background: transparent; }
.track input[type="range"]::-moz-range-track { height: 34px; background: transparent; }
.track input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 4px; height: 34px; background: var(--gold); border: 0; border-radius: 0; }
.track input[type="range"]::-moz-range-thumb { width: 4px; height: 34px; background: var(--gold); border: 0; border-radius: 0; }
.mks { position: relative; height: 17px; }
.mk { position: absolute; top: 0; padding: 1px 0; color: var(--muted); white-space: nowrap; line-height: 16px; }
.mk:hover { color: var(--ink); text-decoration: underline; }
.mk.red { color: var(--s-critical); }
.mk .ml { color: var(--dim); }
.mk.end { transform: translateX(-100%); }
.mk.mid { transform: translateX(-50%); }

/* ---------- lanes ---------- */
.lanes { margin: 0 0 9px; }
.lane { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 0 8px; align-items: start; margin: 0 0 2px; min-height: 13px; }
.ll {
    display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
    height: 13px; line-height: 13px;
    padding: 0 3px; color: var(--muted); overflow: hidden; white-space: nowrap;
}
.ll:hover { color: var(--ink); background: var(--surface); }
.ll[aria-pressed="true"] { color: var(--ink); background: rgba(232, 184, 75, 0.12); box-shadow: inset 2px 0 0 var(--gold); }
.ll .lc { color: var(--dim); }
.cells { display: flex; flex-wrap: wrap; margin-top: calc((13px - var(--cs)) / 2); }
.c {
    display: block; flex: none;
    width: var(--cs); height: var(--cs);
    margin: 0 var(--cg) var(--cg) 0;
    background: var(--signal);
    cursor: pointer;
}
.c.sk { background: transparent; box-shadow: inset 0 0 0 1px var(--dim); }
.c.dr { border-radius: 50%; }
.c.rec { box-shadow: inset 0 0 0 2px var(--s-critical); }
.c.off { opacity: .13; pointer-events: none; }
.c.fut { opacity: .06; pointer-events: none; }
.c.sel { box-shadow: 0 0 0 2px var(--gold), 0 0 0 3.5px var(--paper); position: relative; z-index: 2; }
.c.sel.rec { box-shadow: inset 0 0 0 2px var(--s-critical), 0 0 0 2px var(--gold), 0 0 0 3.5px var(--paper); }
.c:hover, .c.hl { outline: 1px solid var(--ink); outline-offset: 1px; position: relative; z-index: 3; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 2px 0 0; color: var(--dim); font-size: 11px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 9px; height: 9px; }
.lg-ok { background: var(--signal); }
.lg-sk { box-shadow: inset 0 0 0 1px var(--dim); }
.lg-rec { background: var(--signal); box-shadow: inset 0 0 0 2px var(--s-critical); }
.lg-dr { background: var(--signal); border-radius: 50%; }
.tip {
    position: fixed; z-index: 10; pointer-events: none; max-width: 260px;
    background: var(--void); color: var(--ink); border: 1px solid var(--rule);
    padding: 3px 7px; font-size: 11.5px; line-height: 1.4;
}
.tip span { color: var(--muted); display: block; }

/* ---------- facets ---------- */
.facets { display: grid; grid-template-columns: repeat(auto-fit, minmax(186px, 1fr)); gap: 8px 12px; margin: 0 0 9px; }
.fc { min-width: 0; }
.fc h3 { margin: 0 0 3px; font: 400 11.5px/1.4 var(--f-mono); color: var(--dim); }
.fc .fnote { margin: 3px 0 0; font-size: 11px; line-height: 1.45; color: var(--dim); }
.fc .fnote b { font-weight: 400; color: var(--muted); }
.fb {
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    width: 100%; min-height: 21px; padding: 1px 6px; margin: 0 0 2px;
    background: var(--surface); border: 1px solid var(--rule); color: var(--muted);
}
.fb::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--w, 0) * 1%); background: rgba(86, 182, 194, 0.17); }
.fb > span { position: relative; }
.fb .n { color: var(--ink); }
.fb:hover { border-color: var(--gold); color: var(--ink); }
.fb[aria-pressed="true"] { border-color: var(--gold); background: rgba(232, 184, 75, 0.11); color: var(--ink); }
.fb.rule::before { background: rgba(229, 192, 123, 0.16); }
.chips { display: flex; flex-wrap: wrap; gap: 3px; margin: 0; padding: 0; list-style: none; }
.chips .fb { width: auto; margin: 0; padding: 1px 7px; gap: 7px; }
.chips .fb::before { display: none; }
.chips .fb .n { color: var(--s-critical); }
.chips .fb[aria-pressed="true"] { border-color: var(--s-critical); background: rgba(224, 108, 117, 0.13); }
.chips .spec {
    display: inline-flex; gap: 7px; min-height: 21px; padding: 1px 7px; align-items: center;
    color: var(--dim); border: 1px dashed var(--rule);
}
.chips .spec .n { color: var(--dim); }
.rbar { display: flex; height: 9px; margin: 0 0 4px; gap: 1px; }
.rbar i { display: block; min-width: 1px; background: var(--s-critical); }
.rbar i.sp { background: repeating-linear-gradient(135deg, rgba(224, 108, 117, 0.55) 0 2px, transparent 2px 4px); }
.rule-all { margin: 0 0 3px; padding: 2px 6px; border: 1px dashed var(--rule); color: var(--dim); font-size: 11px; line-height: 1.45; }
.rule-all b { font-weight: 400; color: var(--muted); }

/* ---------- list ---------- */
.list { border: 1px solid var(--rule); background: var(--surface); }
.scroll { position: relative; max-height: 204px; overflow: auto; overscroll-behavior: contain; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
th {
    position: sticky; top: 0; z-index: 3; height: 22px; padding: 0; text-align: left; font-weight: 400;
    background: var(--surface-2); border-bottom: 1px solid var(--rule); color: var(--dim);
}
th button { display: block; width: 100%; height: 22px; padding: 0 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
th button:hover { color: var(--ink); }
th[aria-sort="ascending"] button::after { content: " \25B2"; color: var(--gold); font-size: 9px; }
th[aria-sort="descending"] button::after { content: " \25BC"; color: var(--gold); font-size: 9px; }
th .plain { display: block; padding: 0 6px; line-height: 22px; }
td { height: 20px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--surface-2); color: var(--muted); }
td.n, td.fs { color: var(--dim); }
td.nm { padding: 0; color: var(--ink); }
td.nm button { display: block; width: 100%; height: 20px; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
td.nm .x { color: var(--dim); }
tr.r:hover td { background: rgba(255, 255, 255, 0.03); }
tr.r.sel td { background: rgba(232, 184, 75, 0.10); }
tr.r.sel td.nm { box-shadow: inset 2px 0 0 var(--gold); }
.dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; vertical-align: 0; background: var(--signal); }
.dot.sk { background: transparent; box-shadow: inset 0 0 0 1px var(--dim); }
.tag { color: var(--s-moderate); }
.tag + .tag::before { content: " "; }
td.rc { color: var(--s-critical); }
tr.detail td { height: auto; padding: 6px 8px 7px 12px; white-space: normal; overflow: visible; background: var(--void); border-bottom: 1px solid var(--rule); color: var(--muted); font-size: 11.5px; line-height: 1.5; }
tr.detail pre {
    margin: 0 0 5px; padding: 0; max-height: 112px; overflow: auto; color: var(--ink); font: 12px/1.45 var(--f-mono); white-space: pre-wrap; word-break: break-word;
}
tr.detail p { margin: 0; }
tr.detail b { font-weight: 400; color: var(--ink); }
tr.empty td { height: 44px; text-align: center; white-space: normal; color: var(--dim); }
.c1 { width: 72px; } .c2 { width: auto; } .c3 { width: 84px; } .c4 { width: 152px; } .c5 { width: 152px; } .c6 { width: 64px; } .c7 { width: 56px; }

/* ---------- key ---------- */
.key { margin: 9px 0 0; font-size: 11.5px; line-height: 1.55; color: var(--dim); }
.key p { margin: 0 0 4px; }
.key details { margin: 0 0 5px; }
.key summary { cursor: pointer; color: var(--muted); list-style: none; }
.key summary::-webkit-details-marker { display: none; }
.key summary::before { content: "\25B8  "; color: var(--gold); }
.key details[open] summary::before { content: "\25BE  "; }
.key summary:hover { color: var(--ink); }
.key details > p { margin: 4px 0; }
.key b { font-weight: 400; color: var(--muted); }
.verdicts { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 0 0 4px; padding: 0; list-style: none; }
.verdicts li { display: inline-flex; align-items: baseline; gap: 5px; }
.verdicts i { width: 7px; height: 7px; display: inline-block; flex: none; }
.verdicts b { color: var(--ink); }
.static-note { margin: 0 0 6px; color: var(--muted); }

@media (max-width: 740px) {
    .h-ln, .h-fs { display: none; }
}
@media (max-width: 600px) {
    .h-ru { display: none; }
    .c4 { width: 124px; }
}
@media (max-width: 520px) {
    :root { --cs: 7px; --cg: 1.5px; }
    .mk .ml { display: none; }
    .pre { display: none; }
    .frows { display: flex; flex-wrap: wrap; gap: 3px; }
    .frows .fb { width: auto; margin: 0; padding: 1px 7px; gap: 8px; }
    .frows .fb::before { display: none; }
    .c4 { width: 100px; }
    .lane { grid-template-columns: 62px minmax(0, 1fr); gap: 0 5px; }
    .ll .lc { display: none; }
    .ll { font-size: 11px; }
    .h-rc { display: none; }
    .c1 { width: 44px; }
    .facets { grid-template-columns: minmax(0, 1fr); }
}
@media (pointer: coarse) {
    .fb, .rt { min-height: 30px; }
    .chip { min-height: 30px; }
    .chips .spec { min-height: 30px; }
    .ll { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
}

</style>

            <summary>how the suite grades a case: EXACT, CLOSE, RECOVERED, IGNORED, DIFFERENT</summary>
            <p>In JsCompatTests.kt both brains play the pattern for 32 cycles, only events that start are kept, and the counts must match. Then every field of every pair gets one verdict:</p>
            <ul class="verdicts">

(function () {

    var root = document.documentElement;

    var NDAYS = 71;

        22: "the part/whole refactor lands: 2374 of 2476 tests pass",
        23: "the record of the red run: 103 of 2476 tests fail",

    // ---- the model, read from the static markup --------------------------------------------------------

    var meta = JSON.parse($("codes").textContent);   // per row: [commit, source comment, how it is drawn, record note, code]
    var rows = [], byId = {};
    all("tr.r", tbody).forEach(function (tr) {
        var td = tr.querySelector("td.nm"), m = meta[+tr.dataset.r];

        btn.setAttribute("aria-expanded", "false");
        while (td.firstChild) { btn.appendChild(td.firstChild); }
        td.appendChild(btn);
        td.removeAttribute("title");   // the static markup keeps the code as a hover title for readers without script
        var r = {

            name: btn.firstChild.textContent,
            ln: +tr.dataset.ln, st: tr.dataset.st || "c", rs: tr.dataset.rs || "",
            ru: tr.dataset.ru ? tr.dataset.ru.split(" ") : [],
            rc: +(tr.dataset.rc || 0), rx: m[3], fs: +tr.dataset.fs, cnt: +(tr.dataset.cnt || 1),
            num: tr.children[0].textContent, date: "2026-" + tr.querySelector("td.fs").textContent, hash: m[0],

        if (r.fs > state.day) { return false; }
        if (f.st.size && !f.st.has(r.st)) { return false; }
        if (f.rs.size && !f.rs.has(r.rs)) { return false; }
        if (f.ru.size && !r.ru.some(function (x) { return f.ru.has(x); })) { return false; }
        if (f.rc.size && !f.rc.has(String(r.rc))) { return false; }
        if (f.ln.size && !f.ln.has(String(r.ln))) { return false; }
        return true;
    }

                shown += r.cnt;

                if (r.rc) { rec += r.cnt; }

        rComp.textContent = comp;
        rSkip.textContent = skip;
        rRec.textContent = rec;
        emptyRow.hidden = anyVisible;
        resetBtn.disabled = !active();
        if (state.sel !== null && !byId[state.sel].v) { closeDetail(); }
        ensureTab();
        markSel();

    }

        dayIn.value = d;
        var iso = isoOf(d);
        dayOut.textContent = iso;
        var note = NOTES[d] || "";

        dayNote.style.color = (d === RED_DAY) ? "var(--s-critical)" : "";

        var x = d / NDAYS * 720;
        future.setAttribute("x", x);
        future.setAttribute("width", 720 - x);
        apply();

    dayIn.addEventListener("input", function () { setDay(+dayIn.value); });
    all(".mk").forEach(function (b) { b.addEventListener("click", function () { setDay(+b.dataset.day); }); });

        if (set.has(v)) { set.delete(v); } else { set.add(v); }

        });
        apply();
    });

    function stRank(r) {

    }
    var PRIMARY = {

        name: function (a, b) { return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : (a.name.toLowerCase() > b.name.toLowerCase() ? 1 : 0); },
        ln: function (a, b) { return a.ln - b.ln; },
        st: function (a, b) { return stRank(a) - stRank(b); },
        ru: function (a, b) { return b.ru.length - a.ru.length; },
        rc: function (a, b) { return (a.rc || 99) - (b.rc || 99); },
        fs: function (a, b) { return a.fs - b.fs; }
    };
    function sortRows() {

        var sorted = rows.slice().sort(function (a, b) { return dir * PRIMARY[k](a, b) || a.ord - b.ord; });
        sorted.forEach(function (r) {
            tbody.insertBefore(r.tr, emptyRow);
            if (state.detail && state.sel === r.id) { tbody.insertBefore(state.detail, emptyRow); }
        });
        all("thead th").forEach(function (th) {
            var b = th.querySelector("button");
            th.setAttribute("aria-sort", b.dataset.k === k ? (dir === 1 ? "ascending" : "descending") : "none");
        });
    }
    all("thead button").forEach(function (b) {
        b.addEventListener("click", function () {
            var k = b.dataset.k;
            if (state.sort.k === k) { state.sort.dir = -state.sort.dir; } else { state.sort.k = k; state.sort.dir = 1; }
            sortRows();
        });
    });

    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) { e.className = cls; }

    function reasonText(k) {
        for (var i = 0; i < REASONS.length; i++) { if (REASONS[i][0] === k) { return REASONS[i][1]; } }
        return k;
    }
    // the detail row spans the columns that are showing; the narrow layouts hide some of them
    function shownColumns() {
        return all("thead th").filter(function (th) { return th.offsetParent !== null; }).length || 1;
    }
    function fitSpans() {
        emptyRow.firstChild.colSpan = shownColumns();
        if (state.detail) { state.detail.firstChild.colSpan = shownColumns(); }

        td.appendChild(p);
        if (r.drawn) {
            td.appendChild(el("p", "", "The suite draws " + r.drawn + ", at random, on every run."));
        }
        if (r.note) {
            td.appendChild(el("p", "", "Comment in the source: “" + r.note + "”"));
        }
        if (r.st === "c") {
            var rules = "Accepted: data.patternId ignored; data.gain recovered when JS says 1.0 and ours says none";
            r.ru.forEach(function (k) { rules += "; " + RULE_LABEL[k]; });
            td.appendChild(el("p", "", rules + "."));
        }
        td.appendChild(el("p", "", "First commit whose files contain this code: " + r.date + " (" + r.hash + ")."));
        if (r.rc) {
            var rec = RECS[r.rc];
            td.appendChild(el("p", "", "Named in the record of 2026-02-01 (category " + r.rc + ", " + rec + ")" +
                (r.rx === "edited" ? "; a case of this name, but its code has changed since." : ".")));
        }
        tr.appendChild(td);
        return tr;
    }
    function closeDetail() {
        if (state.detail) { state.detail.parentNode.removeChild(state.detail); state.detail = null; }
        if (state.sel !== null) {
            var r = byId[state.sel];
            r.tr.classList.remove("sel");
            r.btn.setAttribute("aria-expanded", "false");
        }
        state.sel = null;
        markSel();
    }
    function reveal(r) {
        var d = state.detail;
        var top = r.tr.offsetTop, h = r.tr.offsetHeight + (d ? d.offsetHeight : 0), head = 22;
        if (top - head < scroll.scrollTop || h > scroll.clientHeight - head) {
            scroll.scrollTop = top - head;
        } else if (top + h > scroll.scrollTop + scroll.clientHeight) {
            scroll.scrollTop = top + h - scroll.clientHeight;
        }
    }
    function openDetail(r) {
        closeDetail();
        state.sel = r.id;
        r.tr.classList.add("sel");
        r.btn.setAttribute("aria-expanded", "true");
        state.detail = detailFor(r);
        r.tr.parentNode.insertBefore(state.detail, r.tr.nextSibling);
        markSel();
        reveal(r);
    }
    function toggle(r) { if (state.sel === r.id) { closeDetail(); } else { openDetail(r); } }

    tbody.addEventListener("click", function (e) {
        var tr = e.target.closest("tr.r");
        if (tr) { setTab(byId[+tr.dataset.r]); toggle(byId[+tr.dataset.r]); }
    });

    // ---- keyboard: one tab stop in the list, arrows move between rows ----------------------------------
    function setTab(r) {
        if (state.tab) { state.tab.btn.tabIndex = -1; }
        state.tab = r;
        if (r) { r.btn.tabIndex = 0; }
    }
    function ensureTab() {
        if (state.tab && state.tab.v) { return; }
        var first = null;
        for (var i = 0; i < rows.length; i++) { if (rows[i].v && (!first || rows[i].tr.offsetTop < first.tr.offsetTop)) { first = rows[i]; } }
        setTab(first);
    }
    function visibleRows() {
        return all("tr.r", tbody).filter(function (tr) { return !tr.hidden; }).map(function (tr) { return byId[+tr.dataset.r]; });
    }
    tbody.addEventListener("keydown", function (e) {
        var tr = e.target.closest("tr.r");
        if (!tr) { return; }
        var list = visibleRows(), i = list.indexOf(byId[+tr.dataset.r]), j = i;
        if (e.key === "ArrowDown") { j = i + 1; }
        else if (e.key === "ArrowUp") { j = i - 1; }
        else if (e.key === "PageDown") { j = i + 8; }
        else if (e.key === "PageUp") { j = i - 8; }
        else if (e.key === "Home") { j = 0; }
        else if (e.key === "End") { j = list.length - 1; }
        else if (e.key === "Escape") { closeDetail(); return; }
        else { return; }
        e.preventDefault();
        j = Math.max(0, Math.min(list.length - 1, j));
        setTab(list[j]);
        list[j].btn.focus({ preventScroll: true });
        reveal(list[j]);
    });

    // ---- linked highlights between the list and the lanes; the tooltip on the cells ---------------------
    function highlight(r, on) { if (r) { r.cells.forEach(function (c) { c.classList.toggle("hl", on); }); } }
    tbody.addEventListener("mouseover", function (e) { var tr = e.target.closest("tr.r"); if (tr) { highlight(byId[+tr.dataset.r], true); } });
    tbody.addEventListener("mouseout", function (e) { var tr = e.target.closest("tr.r"); if (tr) { highlight(byId[+tr.dataset.r], false); } });
    tbody.addEventListener("focusin", function (e) { var tr = e.target.closest("tr.r"); if (tr) { highlight(byId[+tr.dataset.r], true); } });
    tbody.addEventListener("focusout", function (e) { var tr = e.target.closest("tr.r"); if (tr) { highlight(byId[+tr.dataset.r], false); } });

    var tip = el("div", "tip");
    tip.hidden = true;
    document.body.appendChild(tip);
    function showTip(e) {
        var c = e.target.closest ? e.target.closest(".c") : null;
        if (!c || c.classList.contains("off") || c.classList.contains("fut")) { tip.hidden = true; return; }
        var r = byId[+c.dataset.r];
        tip.textContent = r.name;
        var s = el("span", "", r.num + ", " + (r.st === "c" ? "compared" : "skipped: " + reasonText(r.rs)) +
            (r.drawn ? ", drawn at random" : "") + (r.rc ? ", named on Feb 1" : ""));
        tip.appendChild(s);
        tip.hidden = false;
        var x = e.clientX + 12, y = e.clientY + 14, w = tip.offsetWidth;
        if (x + w > window.innerWidth - 4) { x = Math.max(4, window.innerWidth - w - 4); }
        if (y + tip.offsetHeight > window.innerHeight - 4) { y = e.clientY - tip.offsetHeight - 10; }
        tip.style.left = x + "px";
        tip.style.top = y + "px";
    }
    lanesEl.addEventListener("pointermove", showTip);
    lanesEl.addEventListener("pointerleave", function () { tip.hidden = true; });
    lanesEl.addEventListener("click", function (e) {
        var c = e.target.closest(".c");
        if (!c || c.classList.contains("off") || c.classList.contains("fut")) { return; }
        var r = byId[+c.dataset.r];
        setTab(r);
        openDetail(r);
        tip.hidden = true;
    });

    // ---- start -----------------------------------------------------------------------------------------
    setDay(NDAYS);
    setTab(rows[0]);
    sortRows();
    fitSpans();

    // ---- self-sizing -----------------------------------------------------------------------------------
    function post() {
        var h = Math.ceil(document.body.getBoundingClientRect().height);
        try {
            window.parent.postMessage({ type: "klang-figure-height", height: h }, "*");
        } catch (err) { /* nobody listens: the frame keeps its default height */ }
    }
    if ("ResizeObserver" in window) { new ResizeObserver(post).observe(document.body); }
    window.addEventListener("resize", function () { fitSpans(); post(); });
    window.addEventListener("load", post);
    post();
})();

</script>
</body>
</html>
