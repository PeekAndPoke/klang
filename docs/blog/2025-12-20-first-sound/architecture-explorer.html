<title>First Sound: the architecture of December 2025</title>
<!--
  Figure for docs/blog/2025-12-20-first-sound/index.md. One file, no build step.
  Every box exists twice: as a <g class="node" data-node="..."> in the drawing and as an <li class="item"
  data-node="..."> in the list below it. The list is the source: the inspector, the phone view and the no-script
  view all read it, so a change to a box goes into both places with the same data-node.
  The state drawn is commit 4c0b8763 (2025-12-31); every number in it comes from that tree or from git log.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
    :root {
        color-scheme: dark;
        --void: #12131C;
        --paper: #191C22;
        --surface: #21252B;
        --surface-2: #2C313A;
        --ink: #D7DADF;
        --muted: #ABB2BF;
        --faint: #5C6370;
        --rule: #353A42;
        --spark: #D19A66;
        --spark-bg: #362820;
        --signal: #56B6C2;
        --signal-bg: #1A2A30;
        --gold: #E8B84B;
        --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
        --f-body: Charter, "Bitstream Charter", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --f-mono: "Share Tech Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        margin: 0;
        padding: 2px 2px 4px;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--f-body);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    figure.fig { margin: 0; display: flex; flex-direction: column; gap: 8px; }
    code { font-family: var(--f-mono); font-size: 0.92em; color: var(--ink); }

    /* ---------- the dot: a scar number ---------- */
    .dot {
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: var(--gold);
        color: var(--void);
        font: 700 10px/1 var(--f-display);
        font-style: normal;
    }
    .dot.ghost { background: transparent; border: 1px dashed var(--faint); color: var(--muted); }

    /* ---------- the toolbar: lenses and worlds ---------- */
    .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 16px; }
    .toolbar .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .lab { font: 400 11px/1 var(--f-mono); color: var(--muted); margin-right: 2px; }
    .chip, .seg {
        appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 400 11.5px/1.2 var(--f-mono);
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--rule);
        border-radius: 0;
        padding: 4px 8px;
        cursor: pointer;
        transition: border-color .12s, background-color .12s, color .12s;
    }
    .chip:hover, .seg:hover { border-color: var(--muted); color: var(--ink); }
    .chip[aria-pressed="true"] { border-color: var(--gold); color: var(--ink); background: rgba(232, 184, 75, 0.1); }
    .segs { display: inline-flex; }
    .segs .seg + .seg { border-left: 0; }
    .seg[aria-pressed="true"] { border-color: var(--spark); color: var(--ink); background: var(--spark-bg); }
    .segs .seg[aria-pressed="true"] + .seg { border-left: 1px solid var(--spark); }
    .no-js .toolbar, .no-js .insp { display: none; }

    /* ---------- the drawing ---------- */
    .stage { min-width: 0; }
    svg.draw { display: block; width: 100%; height: auto; max-width: 880px; margin: 0 auto; overflow: visible; }
    .draw text { font-family: var(--f-mono); fill: var(--muted); }
    .draw .hd { font-size: 10.5px; letter-spacing: 0.04em; }
    .draw .hl { fill: none; stroke: var(--rule); stroke-width: 1; }
    .draw .band > rect:first-child { fill: none; stroke: var(--rule); stroke-width: 1; }
    .draw .band .tab { fill: var(--paper); stroke: none; }
    .draw .band text { font-size: 10.5px; }

    .edge path { fill: none; stroke: var(--faint); stroke-width: 1.3; marker-end: url(#ah); transition: stroke .12s; }
    .edge.line path, .edge.runs path, .edge.guide path { marker-end: none; }
    .edge.dashed path { stroke-dasharray: 4 3; }
    .edge.runs path { stroke-dasharray: 4 3; }
    .edge.dotted path { stroke-dasharray: 1.5 3.2; stroke-linecap: round; }
    .edge.guide path { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1 4; }
    .edge text { font-size: 10px; fill: var(--muted); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
    .edge.on path { stroke: var(--spark); stroke-width: 1.8; }
    .edge.on:not(.line):not(.runs):not(.guide) path { marker-end: url(#ah-on); }
    .edge.on text { fill: var(--spark); }
    #ah path { fill: var(--faint); }
    #ah-on path { fill: var(--spark); }

    .node { cursor: pointer; outline: none; transition: opacity .15s; }
    .node .box { fill: var(--surface-2); stroke: var(--rule); stroke-width: 1; transition: fill .12s, stroke .12s; }
    .node.borrowed .box { fill: var(--signal-bg); stroke: var(--signal); }
    .node.cell .box { fill: var(--surface); }
    .node.chip .box { fill: var(--surface); stroke: var(--muted); }
    .node.ghost .box, .node.pill .box { fill: var(--paper); stroke: var(--faint); stroke-dasharray: 4 3; }
    .node .acc { fill: none; stroke: var(--spark); stroke-width: 2; opacity: 0; transition: opacity .12s; }
    .node .t { font-family: var(--f-display); font-weight: 700; font-size: 12.5px; fill: var(--ink); }
    .node .s { font-size: 10.5px; fill: var(--muted); }
    .node .c { font-size: 10px; fill: var(--ink); }
    .node.ghost .t, .node.ghost .s, .node.pill .c { fill: var(--muted); }
    .node:hover .box, .node.hov .box { stroke: var(--spark); }
    .node:hover .acc, .node.hov .acc, .node.sel .acc { opacity: 1; }
    .node.sel .box { fill: var(--spark-bg); stroke: var(--spark); stroke-width: 1.5; }
    .node:focus-visible .box { stroke: var(--spark); stroke-width: 2.2; }
    .node.lit .box { stroke: var(--gold); stroke-width: 1.6; }
    .node.lit.sel .box, .node.lit:hover .box { stroke: var(--spark); }
    .node.dim, .edge.dim { opacity: 0.22; }
    .draw .bd circle { fill: var(--gold); stroke: var(--paper); stroke-width: 1.5; }
    .draw .bd text { font: 700 10px var(--f-display); fill: var(--void); }

    .legend { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font: 400 11px/1.4 var(--f-mono); color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .sw { display: inline-block; width: 16px; height: 9px; border: 1px solid var(--rule); background: var(--surface-2); }
    .sw.borrowed { background: var(--signal-bg); border-color: var(--signal); }
    .sw.ghost { background: transparent; border: 1px dashed var(--faint); }
    .sw.guide { width: 18px; height: 0; border: 0; border-top: 1px dotted var(--faint); background: none; }
    .sw.runs { width: 18px; height: 0; border: 0; border-top: 1px dashed var(--faint); background: none; }

    /* ---------- the inspector ---------- */
    .insp {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-left: 2px solid var(--signal);
        padding: 9px 12px 8px;
        min-width: 0;
    }
    .insp.pinned { border-left-color: var(--spark); }
    .insp.probe { position: absolute; left: 2px; top: 0; visibility: hidden; pointer-events: none; }
    .insp-head { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; margin: 0 0 6px; }
    .insp h3 { font: 700 15px/1.2 var(--f-display); letter-spacing: -0.005em; margin: 0; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; font: 400 10.5px/16px var(--f-mono); }
    .tag { border: 1px solid var(--rule); padding: 0 6px; color: var(--muted); }
    .tag.borrowed { border-color: var(--signal); color: var(--signal); }
    .tag.parked { border-style: dashed; }
    .tag.scar { border-color: var(--gold); color: var(--gold); }
    .insp-body { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 2px 18px; }
    .insp p, .story p { margin: 0 0 6px; font-size: 13px; line-height: 1.4; color: var(--muted); }
    .scar, .park {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        border-left: 2px solid var(--gold);
        padding-left: 8px;
        color: var(--ink);
    }
    p.scar .dot { margin-top: 2px; }
    p.park { border-left-style: dashed; border-left-color: var(--faint); display: block; }
    .facts { margin: 0; font: 400 11px/1.4 var(--f-mono); color: var(--muted); }
    .facts > div { display: grid; grid-template-columns: 5.4em minmax(0, 1fr); gap: 0 8px; margin: 0 0 3px; }
    .facts dt { color: var(--muted); opacity: 0.8; }
    .facts dd { margin: 0; overflow-wrap: break-word; color: var(--ink); }
    .teasers { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
    .tz { appearance: none; display: flex; align-items: baseline; gap: 8px; background: none; border: 0; border-radius: 0; padding: 2px 0; font: 400 11.5px/1.35 var(--f-mono); color: var(--muted); cursor: pointer; text-align: left; }
    .tz .dot { align-self: center; }
    .tz b { font-weight: 400; color: var(--ink); white-space: nowrap; }
    .tz span { min-width: 0; }
    .tz:hover b { color: var(--gold); }
    .touch-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 0; }
    .touch-chips button { font: 400 11px/1.2 var(--f-mono); padding: 2px 6px; }

    /* ---------- the flow list: the no-JS and the phone view ---------- */
    .flow h3.bh { font: 400 11px/1.3 var(--f-mono); color: var(--muted); margin: 10px 0 4px; }
    .flow ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
    .item details { background: var(--surface-2); border: 1px solid var(--rule); transition: border-color .12s; }
    .item.borrowed details { background: var(--signal-bg); border-color: var(--signal); }
    .item.ghost details { background: var(--paper); border-style: dashed; border-color: var(--faint); }
    .item summary {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 8px;
        padding: 6px 8px 6px 26px;
        cursor: pointer;
        list-style: none;
        position: relative;
    }
    .item summary::-webkit-details-marker { display: none; }
    .item summary::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 13px;
        width: 6px;
        height: 6px;
        border-right: 1.5px solid var(--muted);
        border-bottom: 1.5px solid var(--muted);
        transform: rotate(-45deg);
        transition: transform .12s;
    }
    .item details[open] summary::before { transform: rotate(45deg); top: 11px; }
    .item summary b { font: 700 13.5px/1.25 var(--f-display); }
    .item .sub { font: 400 11px/1.3 var(--f-mono); color: var(--muted); }
    .item .dots { display: inline-flex; gap: 3px; }
    .item .dots:empty { display: none; }
    .wtag { margin-left: auto; font: 400 10px/15px var(--f-mono); padding: 0 5px; border: 1px solid var(--rule); color: var(--muted); }
    .item .body { padding: 0 10px 6px 26px; }
    .item .body p { margin: 0 0 6px; font-size: 13.5px; line-height: 1.42; color: var(--muted); }
    .item.dim { opacity: 0.3; }
    .item.lit details { border-color: var(--gold); }
    .item summary:hover { background: rgba(255, 255, 255, 0.03); }

    .stories { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .story h4 { display: flex; align-items: center; gap: 8px; font: 700 14px/1.2 var(--f-display); margin: 0 0 4px; }
    .story .touch { font: 400 11px/1.4 var(--f-mono); color: var(--muted); }

    /* ---------- which view shows ---------- */
    .only-narrow { display: none; }
    @media (min-width: 700px) {
        .js .flow, .js .stories { display: none; }
    }
    @media (max-width: 699px) {
        svg.draw, .legend.for-draw { display: none; }
        .only-wide { display: none; }
        .only-narrow { display: inline; }
        .insp-body { grid-template-columns: minmax(0, 1fr); }
        .no-js .stories { display: flex; }
        .js .stories { display: none; }
    }
</style>
</head>

<section class="flow" aria-label="Every box of the drawing, one by one">
<h3 class="bh">:strudel and the app</h3><ol>
<li class="item" data-node="code" data-world="jvm" data-module="app" data-lens=""><details><summary><span class="dots"></span><b>pattern code</b> <span class="sub">a string of Strudel code</span><span class="wtag jvm">JVM only</span></summary><div class="body"><p class="what">A pattern is a Kotlin string of Strudel code, such as <code>sound("bd hh sd oh").gain(0.8)</code>. The test patterns sat in one object, and its first entry played when the desktop app started.</p><dl class="facts"><div><dt>file</dt><dd>src/<wbr>commonMain/<wbr>kotlin/<wbr>TestPatterns.kt, 435 lines; <code>active</code>, line 434</dd></div><div><dt>compiled</dt><dd>src/<wbr>jvmMain/<wbr>kotlin/<wbr>Main.kt, <code>strudel.compile(pattern)</code></dd></div></dl></div></details></li>
<li class="item ghost" data-node="brain" data-world="common" data-module="strudel" data-lens="park"><details><summary><span class="dots"></span><b>own brain</b> <span class="sub">parked, a note only</span><span class="wtag common">commonMain</span></summary><div class="body"><p class="what">The seam was there: <code>StrudelPattern</code> had two implementations, and a third could answer the same <code>queryArc</code>. In December it stayed a thought, which is why the box is dashed.</p><p class="park">Parked: any thought of replacing the borrowed brain (section 4 of the post).</p><dl class="facts"><div><dt>seam</dt><dd>strudel/<wbr>.../<wbr>StrudelPattern.kt, <code>interface StrudelPattern</code></dd></div><div><dt>trace</dt><dd>History.md@4c0b8763, line 17: a diary note of 2025-12-28 about a "strudel-parsr"</dd></div></dl></div></details></li>
<li class="item" data-node="tones" data-world="common" data-module="tones" data-lens="s1"><details><summary><span class="dots"><i class="dot">1</i></span><b>Tones</b> <span class="sub">:tones, note to Hz</span><span class="wtag common">commonMain</span></summary><div class="body"><p class="what">Note names to Hz, and scale degrees to notes. Strudel hands <code>n()</code> values over as tiny MIDI numbers, so <code>resolveFreq</code> reads anything at or below MIDI 30 as a scale degree. A heuristic, and a comment in the source says so.</p><p class="scar"><i class="dot">1</i><span>The fight began here, at 05:08 on 2025-12-22 (1f2e244f: "trying to figure out correct notes when scale context is given"). The code moved into <code>:tones</code> on 2025-12-28 (1530889a).</span></p><dl class="facts"><div><dt>file</dt><dd>tones/<wbr>src/<wbr>commonMain/<wbr>kotlin/<wbr>Tones.kt, 93 lines; <code>resolveFreq</code> 57, the cut 68</dd></div><div><dt>used by</dt><dd>GraalStrudelPattern.kt:64, SampleIndexLoader.kt:109</dd></div></dl></div></details></li>
<li class="item borrowed" data-node="graal" data-world="jvm" data-module="strudel" data-lens="s1 park"><details><summary><span class="dots"><i class="dot">1</i></span><b>Graal JS bridge</b> <span class="sub">@strudel/core 1.2.5, JVM only</span><span class="wtag jvm">JVM only</span></summary><div class="body"><p class="what">GraalVM's polyglot JS engine loads an esbuild bundle of <code>@strudel/core</code>, <code>mini</code> and <code>tonal</code> (all 1.2.5). <code>compile(code)</code> returns a promise, <code>queryPattern</code> returns haps, and <code>GraalStrudelPattern</code> copies each hap into a <code>StrudelPatternEvent</code>.</p><p class="scar"><i class="dot">1</i><span>After the <code>n()</code> afternoon the bridge entry lost 30 lines, mostly commented-out experiments (2cb6c640). The diary: "the js bridge got way simpler in the process".</span></p><p class="park">JVM only: the bundle sits in <code>src/jvmMain/resources</code>.</p><dl class="facts"><div><dt>kotlin</dt><dd>strudel/<wbr>.../<wbr>graal/<wbr>: GraalStrudelCompiler.kt 146 lines, GraalStrudelPattern.kt 224</dd></div><div><dt>js</dt><dd>strudel/<wbr>jsbridge/<wbr>strudel-entry.mjs, 66 lines; package.json:14-16</dd></div></dl></div></details></li>
<li class="item" data-node="events" data-world="common" data-module="strudel" data-lens="s1"><details><summary><span class="dots"><i class="dot">1</i></span><b>StrudelPattern</b> <span class="sub">queryArc() gives StrudelPatternEvents</span><span class="wtag common">commonMain</span></summary><div class="body"><p class="what">The seam every pattern plugs into: <code>queryArc(from, to)</code> returns <code>StrudelPatternEvent</code>s, with <code>begin</code>, <code>end</code> and <code>dur</code> in cycles and a <code>VoiceData</code> of 34 fields.</p><p class="scar"><i class="dot">1</i><span><code>VoiceData</code> keeps the words apart: <code>note</code> and <code>freqHz</code> are pitch, <code>sound</code> and <code>soundIndex</code> the pick in a bank (<code>GraalStrudelPattern.kt:59</code> and <code>:81</code>).</span></p><dl class="facts"><div><dt>files</dt><dd>strudel/<wbr>src/<wbr>commonMain/<wbr>kotlin/<wbr>: StrudelPattern.kt, StrudelPatternEvent.kt, StrudelEventSource.kt</dd></div><div><dt>VoiceData</dt><dd>audio_bridge/<wbr>.../<wbr>VoiceData.kt, 84 lines</dd></div></dl></div></details></li>
<li class="item" data-node="json" data-world="browser" data-module="app" data-lens="park"><details><summary><span class="dots"></span><b>recorded events</b> <span class="sub">JSON strings, patterns.kt</span><span class="wtag browser">browser only</span></summary><div class="body"><p class="what">In the repository of 2025-12-31 the browser demo did not run Strudel. <code>js_main.kt</code> plays a recording: JSON events (<code>tetrisJson</code>, <code>strangerThingsJson</code>) in the shape of what the JVM's <code>makeStatic(0.0, 8.0).toJson()</code> prints.</p><p class="park">The asymmetry of section 4: the bridge reached only the JVM, so the browser demo played what the JVM could record.</p><dl class="facts"><div><dt>file</dt><dd>src/<wbr>jsMain/<wbr>kotlin/<wbr>patterns.kt, lines 3 and 175</dd></div><div><dt>picked</dt><dd>js_main.kt:60-62, <code>strangerThingsJson</code></dd></div><div><dt>recorded</dt><dd>src/<wbr>jvmMain/<wbr>kotlin/<wbr>Main.kt:63</dd></div></dl></div></details></li>
<li class="item" data-node="static" data-world="browser" data-module="strudel" data-lens="park"><details><summary><span class="dots"></span><b>Static pattern</b> <span class="sub">loops a recording</span><span class="wtag browser">browser only</span></summary><div class="body"><p class="what"><code>StrudelPattern.Static</code> holds events and answers <code>queryArc</code> by wrapping the window around the recording's length (the last end, rounded up to whole cycles), so an 8-cycle recording repeats.</p><p class="park">The other half of the asymmetry in section 4.</p><dl class="facts"><div><dt>file</dt><dd>strudel/<wbr>.../<wbr>StrudelPattern.kt:14-47; <code>fromJson</code> 24, <code>totalCycles</code> 27, <code>queryArc</code> 29</dd></div></dl></div></details></li>
</ol>
<h3 class="bh">:klang and :audio_fe</h3><ol>
<li class="item" data-node="playerjvm" data-world="jvm" data-module="klang" data-lens=""><details><summary><span class="dots"></span><b>klangPlayer() actual</b> <span class="sub">IO dispatcher, rate probe</span><span class="wtag jvm">JVM only</span></summary><div class="body"><p class="what">The JVM <code>actual</code> of <code>klangPlayer()</code>: asks javax.sound which 16-bit stereo rate it supports closest to 48,000 Hz, then builds the player with <code>JvmAudioBackend</code>, the fetcher on <code>Dispatchers.Default</code> and the audio loop on <code>Dispatchers.IO</code>.</p><dl class="facts"><div><dt>file</dt><dd>klang/<wbr>src/<wbr>jvmMain/<wbr>kotlin/<wbr>index_jvm.kt, 58 lines; dispatchers 32-33, rates 42</dd></div></dl></div></details></li>
<li class="item" data-node="fetcher" data-world="common" data-module="klang" data-lens=""><details><summary><span class="dots"></span><b>KlangPlayer · KlangEventFetcher</b> <span class="sub">look-ahead 1.0 s, loop 16 ms</span><span class="wtag common">commonMain</span></summary><div class="body"><p class="what"><code>KlangPlayer</code> wires a fetcher and a backend around one <code>KlangCommLink</code>. About 60 times a second the fetcher asks the source for a cycle at a time until it is 1.0 s ahead of the audio, sends each event as a <code>ScheduledVoice</code>, and loads the samples of the next 8 cycles in advance.</p><dl class="facts"><div><dt>player</dt><dd>klang/<wbr>.../<wbr>KlangPlayer.kt, 97 lines: 48,000 Hz, block 512, 0.5 cycles per second (32-38)</dd></div><div><dt>fetcher</dt><dd>audio_fe/<wbr>.../<wbr>KlangEventFetcher.kt, 153 lines: 16 ms (58), 1 cycle (30), 8 cycles (26)</dd></div><div><dt>demos</dt><dd>0.7 cycles per second (js_main.kt:57)</dd></div></dl></div></details></li>
<li class="item" data-node="playerjs" data-world="browser" data-module="klang" data-lens=""><details><summary><span class="dots"></span><b>klangPlayer() actual</b> <span class="sub">AudioContext rate probe</span><span class="wtag browser">browser only</span></summary><div class="body"><p class="what">The browser <code>actual</code>: opens a throw-away <code>AudioContext</code> at 48,000 Hz to learn the rate the browser really gives, with two fallbacks, and builds the player with <code>JsAudioBackend</code>. Both dispatchers are <code>Dispatchers.Default</code>: the page has one main thread.</p><dl class="facts"><div><dt>file</dt><dd>klang/<wbr>src/<wbr>jsMain/<wbr>kotlin/<wbr>index_js.kt, 60 lines; <code>AudioContext</code> 38, fallbacks 49 and 56</dd></div></dl></div></details></li>
<li class="item" data-node="decjvm" data-world="jvm" data-module="audio_fe" data-lens=""><details><summary><span class="dots"></span><b>SimpleAudioDecoder</b> <span class="sub">+ DiskUrlCache, JVM</span><span class="wtag jvm">JVM only</span></summary><div class="body"><p class="what">On the JVM, sample files come over Ktor, through an in-memory cache laid over a <code>DiskUrlCache</code> (<code>cache/index</code>, <code>cache/samples</code>), and are decoded by <code>SimpleAudioDecoder</code>.</p><dl class="facts"><div><dt>wiring</dt><dd>audio_fe/<wbr>src/<wbr>jvmMain/<wbr>kotlin/<wbr>samples.kt:17 and 25</dd></div><div><dt>files</dt><dd>decoders/<wbr>: Wav 147, Generic 75, Simple 36 lines; cache/<wbr>DiskUrlCache.kt 85</dd></div></dl></div></details></li>
<li class="item" data-node="samples" data-world="common" data-module="audio_fe" data-lens="s1"><details><summary><span class="dots"><i class="dot">1</i></span><b>Samples</b> <span class="sub">7 sources, index, pitch pick</span><span class="wtag common">commonMain</span></summary><div class="body"><p class="what">Seven sources (six JSON sample maps, one General MIDI soundfont) become an index of banks, sounds and aliases. <code>provide()</code> picks the file: without a note, <code>n</code> indexes into the sound's list; with one, the first sample at or above that pitch wins.</p><p class="scar"><i class="dot">1</i><span>Here <code>n()</code> and <code>note()</code> part for good: the index branch runs when <code>request.note</code> is null, the pitch branch otherwise (<code>SampleIndexLoader.kt:116-137</code>).</span></p><dl class="facts"><div><dt>files</dt><dd>audio_fe/<wbr>.../<wbr>samples/<wbr>: SampleCatalogue.kt 98 lines (<code>default</code> 53), Samples.kt 185, SampleIndexLoader.kt 342</dd></div><div><dt>credit</dt><dd>five of the seven are felixroos/<wbr>dough-samples, with thanks (History.md, 2025-12-23)</dd></div></dl></div></details></li>
<li class="item" data-node="decjs" data-world="browser" data-module="audio_fe" data-lens="s2"><details><summary><span class="dots"><i class="dot">2</i></span><b>BrowserAudioDecoder</b> <span class="sub">decodeAudioData, no cache</span><span class="wtag browser">browser only</span></summary><div class="body"><p class="what">The browser decodes with <code>decodeAudioData</code> on a throw-away <code>OfflineAudioContext</code> and hands channel 0 over with <code>unsafeCast</code>, so nothing is copied per sample. There is no cache layer of ours here.</p><p class="scar"><i class="dot">2</i><span>First round, 2025-12-27: "working but stuttering when loading and decoding new samples" (87a12d24, 18:02). Its diff swapped a per-sample copy for <code>unsafeCast</code>; "no more stuttering" came eight minutes later (fdc55139).</span></p><dl class="facts"><div><dt>files</dt><dd>audio_fe/<wbr>src/<wbr>jsMain/<wbr>kotlin/<wbr>: BrowserAudioDecoder.kt 57 lines, samples.kt 21</dd></div></dl></div></details></li>
</ol>
<h3 class="bh">:audio_bridge</h3><ol>
<li class="item" data-node="lockjvm" data-world="jvm" data-module="audio_bridge" data-lens=""><details><summary><span class="dots"></span><b>KlangLock</b> <span class="sub">ReentrantLock</span><span class="wtag jvm">JVM only</span></summary><div class="body"><p class="what"><code>KlangLock</code> is an <code>expect class</code> that guards the two ring buffers. On the JVM it wraps a <code>ReentrantLock</code>, because the fetcher and the audio loop run on different dispatchers.</p><dl class="facts"><div><dt>actual</dt><dd>audio_bridge/<wbr>src/<wbr>jvmMain/<wbr>kotlin/<wbr>infra/<wbr>KlangLock.kt, 15 lines</dd></div><div><dt>expect</dt><dd>audio_bridge/<wbr>src/<wbr>commonMain/<wbr>kotlin/<wbr>infra/<wbr>KlangLock.kt, 19 lines</dd></div></dl></div></details></li>
<li class="item" data-node="ctl" data-world="common" data-module="audio_bridge" data-lens="s2"><details><summary><span class="dots"><i class="dot">2</i></span><b>control ▼</b> <span class="sub">ScheduleVoice, Sample</span><span class="wtag common">commonMain</span></summary><div class="body"><p class="what">Frontend to backend: <code>Cmd.ScheduleVoice</code> carries a <code>ScheduledVoice</code> (<code>VoiceData</code> plus start, end and gate-end frames); <code>Cmd.Sample</code> carries PCM as <code>NotFound</code>, <code>Complete</code> or <code>Chunk</code>. The ring has 8192 slots.</p><p class="scar"><i class="dot">2</i><span><code>Complete.toChunks()</code> slices PCM into <code>Chunk</code>s (<code>totalSize</code>, <code>chunkOffset</code>, <code>isLastChunk</code>). The stutter fix took <code>@Serializable</code> off <code>Cmd</code> (1908dfbb).</span></p><dl class="facts"><div><dt>file</dt><dd>audio_bridge/<wbr>.../<wbr>infra/<wbr>KlangCommLink.kt, 123 lines: capacity 8192 (8), <code>toChunks</code> (38)</dd></div><div><dt>rough edge</dt><dd><code>send</code> returns false when the ring is full; the fetcher ignored it (KlangEventFetcher.kt:105)</dd></div></dl></div></details></li>
<li class="item" data-node="fb" data-world="common" data-module="audio_bridge" data-lens=""><details><summary><span class="dots"></span><b>feedback ▲</b> <span class="sub">cursor, RequestSample</span><span class="wtag common">commonMain</span></summary><div class="body"><p class="what">Backend to frontend. <code>UpdateCursorFrame(frame)</code> tells the fetcher where the audio is, which is how it knows how far ahead it is. <code>RequestSample(req)</code> asks for a sample the scheduler does not have yet; the fetcher then loads it and answers with <code>Sample.Complete</code>.</p><dl class="facts"><div><dt>file</dt><dd>KlangCommLink.kt:79-90 (<code>Feedback</code>)</dd></div><div><dt>read by</dt><dd><code>processFeedbackEvents</code>, KlangEventFetcher.kt:117</dd></div></dl></div></details></li>
<li class="item" data-node="lockjs" data-world="browser" data-module="audio_bridge" data-lens=""><details><summary><span class="dots"></span><b>KlangLock</b> <span class="sub">a no-op, one thread</span><span class="wtag browser">browser only</span></summary><div class="body"><p class="what">In the browser the lock does nothing ("No-op in single-threaded JS environment", says the comment). The audio thread has its own <code>KlangCommLink</code> inside the worklet, and the two sides talk by messages, not by shared buffers.</p><dl class="facts"><div><dt>actual</dt><dd>audio_bridge/<wbr>src/<wbr>jsMain/<wbr>kotlin/<wbr>infra/<wbr>KlangLock.kt, 12 lines</dd></div><div><dt>worklet side</dt><dd>KlangAudioWorklet.kt:24, <code>val commLink = KlangCommLink()</code></dd></div></dl></div></details></li>
</ol>
<h3 class="bh">:audio_be</h3><ol>
<li class="item" data-node="hostjvm" data-world="jvm" data-module="audio_be" data-lens=""><details><summary><span class="dots"></span><b>JvmAudioBackend</b> <span class="sub">one loop on Dispatchers.IO</span><span class="wtag jvm">JVM only</span></summary><div class="body"><p class="what">One loop on <code>Dispatchers.IO</code>: drain the control ring into the scheduler, render a block of 512 frames, advance the cursor, report it as <code>UpdateCursorFrame</code>, and write the bytes to a <code>SourceDataLine</code>. The write blocks when the 250 ms line buffer is full, which paces the loop.</p><dl class="facts"><div><dt>file</dt><dd>audio_be/<wbr>src/<wbr>jvmMain/<wbr>kotlin/<wbr>JvmAudioBackend.kt, 103 lines</dd></div><div><dt>lines</dt><dd><code>maxOrbits = 16</code> 23; line buffer 54; <code>renderBlock</code> call 79; block size 512 from KlangPlayer.kt:34</dd></div></dl></div></details></li>
<li class="item" data-node="sched" data-world="common" data-module="audio_be" data-lens="s2 s3"><details><summary><span class="dots"><i class="dot">2</i><i class="dot">3</i></span><b>VoiceScheduler</b> <span class="sub">min-heap by startFrame</span><span class="wtag common">commonMain</span></summary><div class="body"><p class="what">Holds scheduled voices in a <code>KlangMinHeap</code> by start frame and promotes them to an active list block by block. It also owns the samples, one entry per request, and asks for a missing one with <code>RequestSample</code>.</p><p class="scar"><i class="dot">2</i><span><code>Partial</code> entries fill chunk by chunk with <code>copyInto</code> at <code>chunkOffset</code> and become <code>Complete</code> on the last chunk (<code>addSample</code>, line 95).</span></p><p class="scar"><i class="dot">3</i><span><code>process(cursorFrame)</code> renders a block per call, and so does each voice.</span></p><dl class="facts"><div><dt>file</dt><dd>audio_be/<wbr>.../<wbr>voices/<wbr>VoiceScheduler.kt, 367 lines: heap 57, <code>addSample</code> 95, <code>promoteScheduled</code> 202</dd></div></dl></div></details></li>
<li class="item" data-node="voices" data-world="common" data-module="audio_be" data-lens="s3"><details><summary><span class="dots"><i class="dot">3</i></span><b>Voice · OscFn</b> <span class="sub">fills a buffer per call</span><span class="wtag common">commonMain</span></summary><div class="body"><p class="what">A <code>Voice</code> is a <code>SynthVoice</code> or a <code>SampleVoice</code>. Each renders a block: the oscillator or the sample resampler fills a buffer, the filters run over it, and <code>mixToOrbit</code> applies envelope, pan, the effects and the sends.</p><p class="scar"><i class="dot">3</i><span>The first draft was <code>typealias OscFn = (frequency: Double) -&gt; Double</code>, a call per sample (42800d3c, 2025-12-21 23:50). Three hours later: <code>process(buffer, offset, length, phase, phaseInc)</code> (b7b9f5c7). The diary: "bad performance though".</span></p><dl class="facts"><div><dt>generators</dt><dd>sine, saw, square, triangle, zawtooth, supersaw, pulze, impulse, five noises (Oscillators.kt, 611 lines; <code>OscFn</code>, line 8)</dd></div><div><dt>voices</dt><dd>SynthVoice.kt:41 <code>osc.process</code>; common.kt:9 <code>mixToOrbit</code></dd></div></dl></div></details></li>
<li class="item" data-node="orbits" data-world="common" data-module="audio_be" data-lens="s3"><details><summary><span class="dots"><i class="dot">3</i></span><b>Orbits</b> <span class="sub">16 buses: delay, reverb</span><span class="wtag common">commonMain</span></summary><div class="body"><p class="what">An orbit is Strudel's word for an effect bus, and the word stayed. Up to 16 of them, each with a stereo mix buffer, a delay send into a <code>DelayLine</code> of up to 10 s and a reverb send into a Freeverb-style <code>Reverb</code> (8 combs, 4 all-passes per channel).</p><p class="scar"><i class="dot">3</i><span>Delay and reverb take a whole block per call too: <code>process(input, output, length)</code>.</span></p><dl class="facts"><div><dt>files</dt><dd>audio_be/<wbr>.../<wbr>orbits/<wbr>Orbits.kt 69 lines, Orbit.kt 74; effects/<wbr>DelayLine.kt 58, Reverb.kt 88</dd></div><div><dt>rough edge</dt><dd>a TODO in Reverb.kt:5: room and size were far stronger than in Strudel</dd></div></dl></div></details></li>
<li class="item" data-node="renderer" data-world="common" data-module="audio_be" data-lens="s3"><details><summary><span class="dots"><i class="dot">3</i></span><b>KlangAudioRenderer</b> <span class="sub">tanh limiter, PCM16</span><span class="wtag common">commonMain</span></summary><div class="body"><p class="what">One <code>renderBlock</code> per block: clear, <code>voices.process</code>, <code>orbits.processAndMix</code>, then a <code>tanh</code> limiter and an interleave to 16-bit little-endian stereo bytes. The JVM backend and the worklet call the same function; the worklet turns the bytes back into floats.</p><p class="scar"><i class="dot">3</i><span>Block by block is the shape: 512 frames on the JVM (10.7 ms at 48,000 Hz), 128 in the worklet (2.7 ms).</span></p><dl class="facts"><div><dt>file</dt><dd>audio_be/<wbr>.../<wbr>KlangAudioRenderer.kt, 53 lines; <code>tanh</code> at 41</dd></div><div><dt>worklet</dt><dd>KlangAudioWorklet.kt:87-137, bytes back to <code>Float32Array</code></dd></div></dl></div></details></li>
<li class="item" data-node="jsbackend" data-world="browser" data-module="audio_be" data-lens="s2"><details><summary><span class="dots"><i class="dot">2</i></span><b>JsAudioBackend</b> <span class="sub">main thread, 1 chunk a frame</span><span class="wtag browser">browser only</span></summary><div class="body"><p class="what">Runs on the main thread. Makes the <code>AudioContext</code> and an <code>AudioWorkletNode</code>, and on every animation frame drains the control ring and posts commands to the worklet. A <code>Sample.Complete</code> is cut into chunks of 32 × 1024 samples, and one chunk goes out per frame.</p><p class="scar"><i class="dot">2</i><span>Second round, 2025-12-28: chunking (1a5ec9f3) "does not really help" (98582145, 18:25); the diary says the chunk size was not the issue.</span></p><dl class="facts"><div><dt>file</dt><dd>audio_be/<wbr>src/<wbr>jsMain/<wbr>kotlin/<wbr>JsAudioBackend.kt, 115 lines: <code>addModule</code> 40, <code>toChunks(32 * 1024)</code> 84</dd></div><div><dt>wrinkle</dt><dd><code>toChunks</code> counts samples, although its parameter is named <code>chunkSizeBytes</code></dd></div></dl></div></details></li>
<li class="item" data-node="contract" data-world="browser" data-module="audio_be" data-lens="s2"><details><summary><span class="dots"><i class="dot">2</i></span><b>WorkletContract</b> <span class="sub">postMessage codec</span><span class="wtag browser">browser only</span></summary><div class="body"><p class="what">The edge between the two threads, a hand-written codec: each <code>Cmd</code> becomes a plain JS object with a <code>type</code> such as <code>schedule-voice</code> or <code>sample-chunk</code>, and float arrays travel as plain fields. Only small types (<code>ScheduledVoice</code>, <code>SampleRequest</code>, <code>Feedback</code>) still use kotlinx.serialization.</p><p class="scar"><i class="dot">2</i><span>The fix of 2025-12-28 22:52 (1908dfbb, "fixed JS stuttering") added 99 lines here. The diary blames kotlinx.serialization on <code>FloatArray</code>; afterwards: "no more stutter when sending 32 kb blocks!"</span></p><dl class="facts"><div><dt>file</dt><dd>audio_be/<wbr>.../<wbr>worklet/<wbr>WorkletContract.kt, 136 lines</dd></div><div><dt>lines</dt><dd>floats as plain fields 57-76; kotlinx on small types 34, 114, 122</dd></div></dl></div></details></li>
<li class="item" data-node="worklet" data-world="browser" data-module="audio_be" data-lens="s2"><details><summary><span class="dots"><i class="dot">2</i></span><b>KlangAudioWorklet</b> <span class="sub">audio thread, 128 frames</span><span class="wtag browser">browser only</span></summary><div class="body"><p class="what">An <code>AudioWorkletProcessor</code> written in Kotlin/JS (the module targets es2015, so Kotlin emits real classes). It builds its own <code>Orbits</code>, <code>VoiceScheduler</code> and <code>KlangAudioRenderer</code>, reads the block size from the output (128 frames, 2.7 ms at 48,000 Hz), renders in <code>process()</code> and sends <code>UpdateCursorFrame</code>.</p><p class="scar"><i class="dot">2</i><span>Receives <code>Sample.Chunk</code>s in <code>port.onmessage</code> and hands them to <code>VoiceScheduler.addSample</code> (lines 72-80).</span></p><dl class="facts"><div><dt>file</dt><dd>audio_be/<wbr>.../<wbr>worklet/<wbr>KlangAudioWorklet.kt, 137 lines; block size at 63</dd></div><div><dt>target</dt><dd>audio_be/<wbr>build.gradle.kts:28-31 (<code>es2015</code>)</dd></div><div><dt>history</dt><dd>History.md, 2025-12-26: "KotlinJS compiler bugs ... hacky workarounds"</dd></div></dl></div></details></li>
<li class="item ghost" data-node="wasm" data-world="browser" data-module="audio_be" data-lens="park"><details><summary><span class="dots"></span><b>Wasm: parked</b> <span class="sub">a stub and a target, 2025-12-26</span><span class="wtag browser">browser only</span></summary><div class="body"><p class="what">A stub and a target, tried on 2025-12-26: <code>AudioProcessingWasm.kt</code> (a 440 Hz sine), a JS glue file and a <code>wasmJs</code> block. On 2025-12-28 the block was commented out. The diary: "will try again later, once the JS backend works".</p><p class="park">Parked, not abandoned (section 4 of the post). It would have replaced the Kotlin/JS worklet.</p><dl class="facts"><div><dt>stub</dt><dd>audio_be/<wbr>src/<wbr>wasmJsMain/<wbr>: AudioProcessingWasm.kt 54 lines, glue 43 (bfeab82a)</dd></div><div><dt>target</dt><dd>audio_be/<wbr>build.gradle.kts:35-39, commented out in 2fcd94f3</dd></div></dl></div></details></li>

<li class="item" data-node="outjs" data-world="browser" data-module="audio_be" data-lens=""><details><summary><span class="dots"></span><b>AudioContext</b> <span class="sub">destination of the node</span><span class="wtag browser">browser only</span></summary><div class="body"><p class="what">The worklet node is connected to <code>ctx.destination</code>, and the two channels of its output carry the floats the worklet wrote.</p><dl class="facts"><div><dt>lines</dt><dd>JsAudioBackend.kt:43-44; KlangAudioWorklet.kt, output channels 0 and 1</dd></div></dl></div></details></li>

</section>
<section class="stories" aria-label="The three scars and what was parked">
<div class="story" data-lens="s1"><h4><i class="dot">1</i>Scar 1: n() is not note()</h4><p>Hours went into a bug that did not exist: <code>n</code> selects within a sound bank, and <code>note</code> sets pitch. We had used <code>note()</code> and expected it to behave like <code>n()</code>. It cost an afternoon (2025-12-22, 17:10 to 18:34: 6f862e8a, 2cb6c640, 65333abc; the diary entry is dated the 23rd) and left a simpler bridge. The two words stay apart in four boxes: the bridge, the event, the tone math and the sample pick.</p><p class="touch">Boxes: Tones, Graal JS bridge, StrudelPattern, Samples.</p></div>
<div class="story" data-lens="s2"><h4><i class="dot">2</i>Scar 2: the worklet stutter</h4><p>Samples reaching the audio thread made it stutter over two days. 2025-12-27: decoding (87a12d24, fdc55139). 2025-12-28, afternoon: chunking, which "does not really help" (98582145). 2025-12-28, 22:52: a hand-written codec for the float arrays (1908dfbb). The lit boxes are the path a sample travels, from the decoder to the scheduler.</p><p class="touch">Boxes: BrowserAudioDecoder, control ▼, VoiceScheduler, JsAudioBackend, WorkletContract, KlangAudioWorklet.</p></div>
<div class="story" data-lens="s3"><h4><i class="dot">3</i>Scar 3: the per-sample callback</h4><p>The first oscillator draft called a function per sample (42800d3c, 2025-12-21 23:50). The diary of 2025-12-22 says "bad performance though". About three hours later every generator filled a buffer per call (b7b9f5c7, 03:08), and the boxes below the bus have been shaped like that since: scheduler, voices, orbits, renderer.</p><p class="touch">Boxes: VoiceScheduler, Voice · OscFn, Orbits, KlangAudioRenderer.</p></div>
<div class="story" data-lens="park"><h4>Parked: Wasm and the borrowed brain</h4><p>Two things were tried, hurt and postponed. Wasm: a stub, a target, then the target commented out (2025-12-26 to 2025-12-28). The borrowed brain: replacing it stayed a note, and because the bridge was JVM-only, the browser demo played recordings.</p><p class="touch">Boxes: own brain, recorded events, Graal JS bridge, Static pattern, Wasm: parked.</p></div>
</section>

    function specForLens(l) {
        var s = stories[l];
        var body = document.createElement("div");
        body.className = "insp-body";
        var a = document.createElement("div");
        a.innerHTML = "<p>" + $("p", s).innerHTML + "</p>";
        var chips = document.createElement("div");
        chips.className = "touch-chips";
        Object.keys(meta).forEach(function (id) {
            if (meta[id].lens.indexOf(l) < 0) { return; }
            var b = document.createElement("button");
            b.type = "button";
            b.className = "chip";
            b.textContent = meta[id].title;
            b.addEventListener("click", function () { state.sel = id; render(); });
            chips.appendChild(b);
        });
        a.appendChild(chips);
        body.appendChild(a);
        return { title: $("h4", s).textContent.replace(/^\d/, ""), tags: [], body: body, pinned: false, dot: $(".dot", s) ? $(".dot", s).textContent : "" };
    }

    function specIntro() {
        var src = $("#intro").content.firstElementChild;
        var body = document.createElement("div");
        body.className = "insp-body";
        var a = document.createElement("div");
        a.appendChild($("p", src).cloneNode(true));
        var tz = $(".teasers", src).cloneNode(true);
        $$(".tz", tz).forEach(function (b) {
            b.addEventListener("click", function () { state.lens = b.getAttribute("data-lens"); render(); });
        });
        a.appendChild(tz);
        var b2 = document.createElement("div");
        b2.appendChild($(".facts", src).cloneNode(true));
        body.appendChild(a);
        body.appendChild(b2);
        return { title: src.getAttribute("data-title"), tags: [], body: body, pinned: false };
    }

    function fill(el, spec) {
        el.textContent = "";
        el.classList.toggle("pinned", !!spec.pinned);
        var head = document.createElement("div");
        head.className = "insp-head";
        if (spec.dot) {
            var d = document.createElement("i");
            d.className = "dot";
            d.textContent = spec.dot;
            head.appendChild(d);
        }
        var h = document.createElement("h3");
        h.textContent = spec.title;
        head.appendChild(h);
        var tg = document.createElement("span");
        tg.className = "tags";
        spec.tags.forEach(function (t) { tg.appendChild(t); });
        head.appendChild(tg);
        el.appendChild(head);
        el.appendChild(spec.body);
    }

    // The inspector keeps the height of the tallest entry, so that the frame does not jump while you read.
    function measure() {
        var probe = document.createElement("div");
        probe.className = "insp probe";
        probe.style.width = insp.getBoundingClientRect().width + "px";
        document.body.appendChild(probe);
        var max = 0;
        function take(spec) {
            fill(probe, spec);
            max = Math.max(max, probe.getBoundingClientRect().height);
        }
        take(specIntro());
        Object.keys(stories).forEach(function (l) { take(specForLens(l)); });
        if (wide.matches) { Object.keys(meta).forEach(function (id) { take(specFor(id)); }); }
        document.body.removeChild(probe);
        insp.style.minHeight = Math.ceil(max) + "px";
        report();
    }

    // ---- state to view
    function inWorld(w) { return state.world === "both" || w === "common" || w === state.world; }
    function inLens(list) { return !state.lens || list.indexOf(state.lens) >= 0; }

    function render() {
        var cur = state.hover || state.sel;
        svgNodes.forEach(function (n) {
            var id = n.getAttribute("data-node");
            var m = meta[id];
            var lit = !!state.lens && inLens(m.lens);
            n.classList.toggle("dim", !(inLens(m.lens) && inWorld(m.world)));
            n.classList.toggle("lit", lit);
            n.classList.toggle("sel", state.sel === id);
            n.classList.toggle("hov", state.hover === id);
            n.setAttribute("aria-pressed", state.sel === id ? "true" : "false");
        });
        svgEdges.forEach(function (e) {
            var ends = e.getAttribute("data-ends").split(" ").filter(Boolean);
            e.classList.toggle("on", !!cur && ends.indexOf(cur) >= 0);
            var dim = ends.some(function (id) { return !(inLens(meta[id].lens) && inWorld(meta[id].world)); });
            if (!ends.length) { dim = false; }
            e.classList.toggle("dim", dim);
        });
        items.forEach(function (li) {
            var m = meta[li.getAttribute("data-node")];
            li.classList.toggle("dim", !(inLens(m.lens) && inWorld(m.world)));
            li.classList.toggle("lit", !!state.lens && inLens(m.lens));
        });
        $$(".toolbar .chip").forEach(function (b) { b.setAttribute("aria-pressed", state.lens === b.getAttribute("data-lens") ? "true" : "false"); });
        $$(".toolbar .seg").forEach(function (b) { b.setAttribute("aria-pressed", state.world === b.getAttribute("data-world") ? "true" : "false"); });

        var show = wide.matches ? cur : null;
        if (show) { fill(insp, specFor(show)); }
        else if (state.lens) { fill(insp, specForLens(state.lens)); }
        else { fill(insp, specIntro()); }
    }

    // ---- events
    // Without this script the boxes are plain drawing; with it they are buttons with one tab stop and arrow keys.
    function rove(on) { svgNodes.forEach(function (m) { m.setAttribute("tabindex", m === on ? "0" : "-1"); }); }
    svgNodes.forEach(function (n, i) {
        n.setAttribute("role", "button");
        n.setAttribute("aria-pressed", "false");
        n.setAttribute("tabindex", i === 0 ? "0" : "-1");
    });
    svgNodes.forEach(function (n) {
        var id = n.getAttribute("data-node");
        n.addEventListener("mouseenter", function () { state.hover = id; render(); });
        n.addEventListener("mouseleave", function () { state.hover = null; render(); });
        n.addEventListener("focus", function () { rove(n); state.hover = id; render(); });
        n.addEventListener("blur", function () { state.hover = null; render(); });
        n.addEventListener("click", function (ev) { ev.stopPropagation(); state.sel = state.sel === id ? null : id; render(); });
        n.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); state.sel = state.sel === id ? null : id; render(); return; }
            var dir = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] }[ev.key];
            if (!dir) { return; }
            ev.preventDefault();
            var next = neighbor(n, dir);
            if (next) { next.focus(); }
        });
    });
    $(".draw").addEventListener("click", function () { if (state.sel) { state.sel = null; render(); } });

    // Arrow keys: the nearest box in that direction, preferring boxes that overlap this one across the direction.
    function rect(n) {
        var b = $(".box", n).getBBox();
        return { x: b.x, y: b.y, w: b.width, h: b.height };
    }
    function neighbor(from, dir) {
        var a = rect(from);
        var best = null, bestScore = 1e9;
        svgNodes.forEach(function (n) {
            if (n === from) { return; }
            var b = rect(n);
            var gap = dir[0] > 0 ? b.x - (a.x + a.w) : dir[0] < 0 ? a.x - (b.x + b.w) : dir[1] > 0 ? b.y - (a.y + a.h) : a.y - (b.y + b.h);
            if (gap < -2) { return; }
            var overlap = dir[0] !== 0
                ? Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y)
                : Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
            var off = dir[0] !== 0
                ? Math.abs((a.y + a.h / 2) - (b.y + b.h / 2))
                : Math.abs((a.x + a.w / 2) - (b.x + b.w / 2));
            var score = gap + (overlap > 0 ? 0 : 400) + 0.3 * off;
            if (score < bestScore) { bestScore = score; best = n; }
        });
        return best;
    }

    $$(".toolbar .chip").forEach(function (b) {
        b.addEventListener("click", function () {
            var l = b.getAttribute("data-lens");
            state.lens = state.lens === l ? null : l;
            render();
        });
    });
    $$(".toolbar .seg").forEach(function (b) {
        b.addEventListener("click", function () { state.world = b.getAttribute("data-world"); render(); });
    });
    document.addEventListener("keydown", function (ev) {
        if (ev.key !== "Escape") { return; }
        if (state.sel) { state.sel = null; } else if (state.lens) { state.lens = null; }
        render();
    });

    // ---- size: report the content height to the host page, on load and on every size change
    var last = 0;
    function report() {
        var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
        if (h && h !== last) {
            last = h;
            try { window.parent.postMessage({ type: "klang-figure-height", height: h }, "*"); } catch (e) { /* no host */ }
        }
    }
    var timer = 0;
    window.addEventListener("resize", function () { window.clearTimeout(timer); timer = window.setTimeout(function () { measure(); render(); }, 80); });
    window.addEventListener("load", function () { measure(); render(); });
    if (wide.addEventListener) { wide.addEventListener("change", function () { measure(); render(); }); }
    if (window.ResizeObserver) { new ResizeObserver(report).observe(document.body); }
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function () { measure(); render(); }); }
    render();
    measure();
})();
</script>
</body>
</html>
