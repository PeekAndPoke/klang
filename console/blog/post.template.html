<script>
// Interactive figures size their own frame: each posts
// { type: "klang-figure-height", height } to this page.
window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'klang-figure-height' || typeof d.height !== 'number') return;
    var frames = document.querySelectorAll('.klang-figure iframe');
    for (var i = 0; i < frames.length; i++) {
        if (frames[i].contentWindow === e.source) {
            frames[i].style.height = Math.min(Math.ceil(d.height), 3000) + 'px';
        }
    }
});
</script>
