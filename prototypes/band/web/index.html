<script>
  // a failure is shown on the page, not only in the console
  const fail = (m) => { const e = document.createElement('pre'); e.textContent = m; e.style.cssText = 'position:fixed;left:12px;top:40px;color:#f66;font:12px monospace;white-space:pre-wrap;max-width:90vw'; document.body.appendChild(e); };
  addEventListener('error', (e) => fail((e.message || 'error') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack || '')));

</script>
