<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klang Mission Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Shared look of the dev-status pages (topic map, mission log). build.py inlines this file.
   Palette: the UI's KlangLookAndFeel (klangui/.../feel/KlangLookAndFeel.kt), plus two blends
   where the pages need more hues: violet = accent x critical, rose = critical x textPrimary. */
:root {
    color-scheme: dark;
    --void: #12131c;        /* menuBackground */
    --app: #191c22;         /* appBackground */
    --panel: #21252b;       /* panelBackground */
    --panel-2: #2c313a;     /* cardBackground */
    --overlay: #353a42;     /* overlayBackground */
    --grid: #1d2026;        /* appBackground x panelBackground */
    --rule: #353a42;
    --text: #d7dadf;        /* textPrimary */
    --dim: #abb2bf;         /* textSecondary */
    --faint: #5c6370;       /* textTertiary */
    --accent: #528bff;
    --accent-muted: #5c7cbc;
    --gold: #e8b84b;
    --cyan: #56b6c2;        /* excellent */
    --green: #98c379;       /* good */
    --yellow: #e5c07b;      /* moderate */
    --orange: #d19a66;      /* warning */
    --red: #e06c75;         /* critical */
    --violet: #997bba;      /* accent x critical */
    --rose: #dba3aa;        /* critical x textPrimary */
    --amber: var(--gold);
    --magenta: var(--red);

    --l-engine: var(--orange);
    --l-sound: var(--red);
    --l-perf: var(--green);
    --l-realtime: var(--violet);
    --l-analysis: var(--accent);
    --l-sprudel: var(--yellow);
    --l-script: var(--cyan);
    --l-launch: var(--rose);

    --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --mono: "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace;
}

html, body { height: 100%; margin: 0; }
* { box-sizing: border-box; }
body {
    background: var(--void);
    color: var(--text);
    font-family: var(--display);
    font-size: 14px;
    overflow: hidden;
}
body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px);
    mix-blend-mode: screen;
}
body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 49;
    background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0, 0, 0, .5) 100%);
}

.app { display: grid; grid-template-rows: auto auto 1fr auto; height: 100%; padding-inline: 16px; padding-block: 12px; gap: 10px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 28px; }
.kicker { font-family: var(--mono); color: var(--cyan); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; opacity: .9; }
h1 {
    margin: 2px 0 0; font-size: 26px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    text-wrap: balance; text-shadow: 0 0 12px rgba(86, 182, 194, .4);
}
h1 span { color: var(--cyan); }

.hud-nav { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.hud-nav a {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; text-decoration: none;
    color: var(--dim); border: 1px solid var(--rule); padding: 2px 8px;
}
.hud-nav a:hover, .hud-nav a:focus-visible { color: var(--text); border-color: var(--cyan); outline: none; }
.hud-nav a[aria-current="page"] { color: var(--void); background: var(--cyan); border-color: var(--cyan); }

.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.stat {
    background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--rule);
    padding: 6px 12px 7px; min-width: 108px;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.stat .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.stat .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .v small { font-size: 12px; color: var(--dim); font-weight: 500; margin-left: 3px; }
.stat.good .v { color: var(--green); text-shadow: 0 0 10px rgba(152, 195, 121, .35); }
.stat.bad .v { color: var(--red); text-shadow: 0 0 10px rgba(224, 108, 117, .35); }
.stat.info .v { color: var(--cyan); }
.stat.warn .v { color: var(--gold); font-size: 18px; padding-top: 3px; }

.bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--dim); }
.bar .group-label { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-left: 6px; }
.toggle {
    font: inherit; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text); background: var(--panel); border: 1px solid var(--rule); padding: 4px 10px; cursor: pointer;
    display: inline-flex; gap: 7px; align-items: center; font-variant-numeric: tabular-nums;
}
.toggle .n { color: var(--faint); }
.toggle[aria-pressed="false"] { color: var(--faint); border-color: var(--grid); }
.toggle[aria-pressed="false"] .sw { opacity: .25; }
.toggle:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
.sw { width: 9px; height: 9px; display: inline-block; transform: rotate(45deg); flex: none; }
.hint { margin-left: auto; color: var(--faint); }

.screen { position: relative; border: 1px solid var(--rule); background: linear-gradient(180deg, rgba(33, 37, 43, .55), rgba(18, 19, 28, .9)); min-height: 0; overflow: hidden; }
.screen::before, .screen::after { content: ""; position: absolute; width: 18px; height: 18px; border: 2px solid var(--cyan); pointer-events: none; opacity: .8; z-index: 4; }
.screen::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
.screen::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }

.inspector {
    position: absolute; right: 12px; top: 12px; width: 340px; max-width: calc(100% - 24px);
    background: rgba(25, 28, 34, .95); border: 1px solid var(--rule);
    box-shadow: 0 0 0 1px rgba(86, 182, 194, .08), 0 0 30px rgba(86, 182, 194, .08);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    z-index: 5;
}
.tag { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border: 1px solid currentColor; }
.iconbtn { font: inherit; background: var(--panel); border: 1px solid var(--rule); color: var(--dim); width: 28px; height: 28px; cursor: pointer; }
.iconbtn:hover { color: var(--text); }
.iconbtn:focus-visible { outline: 1px solid var(--cyan); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--mono); font-size: 11.5px; color: var(--dim); align-items: center; }
.legend svg { vertical-align: middle; margin-right: 6px; }
.legend .sep { flex: 1; }

@media (max-width: 720px) {
    h1 { font-size: 20px; }
    .stats { margin-left: 0; }
    .stat { min-width: 0; flex: 1 1 40%; }
    .hint { display: none; }
    .inspector { top: auto; bottom: 10px; left: 10px; right: 10px; width: auto; }
}
[hidden] { display: none !important; }


.gridline { stroke: var(--grid); }
.gridline.year { stroke: var(--rule); }
.axis text { font-family: var(--mono); font-size: 11px; fill: var(--dim); }
.axis line, .axis path { stroke: var(--rule); }
.lane-bg { fill: rgba(255, 255, 255, .012); }
.lane-bg.alt { fill: rgba(86, 182, 194, .025); }
.lane-label { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.now line { stroke: var(--gold); stroke-width: 1.5; }
.now .beam { fill: url(#beam); }
.now text { font-family: var(--mono); font-size: 11px; fill: var(--gold); letter-spacing: .14em; }
.mil line { stroke: var(--red); stroke-dasharray: 2 5; stroke-opacity: .7; }
.mil text { font-family: var(--mono); font-size: 10.5px; fill: var(--red); letter-spacing: .08em; text-transform: uppercase; }
.mil .dia { fill: var(--void); stroke: var(--red); stroke-width: 1.5; }
.win { stroke-width: 2; stroke-opacity: .35; stroke-linecap: round; }
.dot { cursor: pointer; }
.dot:focus { outline: none; }
.dot:focus-visible .shape, .dot.sel .shape { stroke: #fff; stroke-width: 2; }
.proj .shape { fill: var(--void); stroke-width: 1.6; stroke-dasharray: 2.4 1.8; }
.area-done { fill: url(#doneFill); stroke: var(--green); stroke-width: 1.5; }
.area-proj { fill: url(#projFill); stroke: var(--red); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; fill: var(--dim); text-transform: uppercase; }
.readout { font-family: var(--mono); font-size: 11px; fill: var(--text); }
#vis { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#vis:active { cursor: grabbing; }
.inspector { padding: 14px 16px 16px; display: grid; gap: 10px; }
.inspector .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inspector h2 { margin: 0; font-size: 17px; line-height: 1.25; font-weight: 600; text-wrap: balance; }
.inspector .fid { font-family: var(--mono); font-size: 12px; color: var(--cyan); overflow-wrap: anywhere; }
.inspector .when { font-family: var(--mono); font-size: 13px; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
.inspector .when dt { color: var(--dim); }
.inspector .when dd { margin: 0; }
.inspector p { margin: 0; line-height: 1.5; font-size: 13px; max-width: 60ch; }
.inspector .guess { color: var(--gold); font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; }
.inspector .close { margin-left: auto; }
@media (prefers-reduced-motion: no-preference) {
    .now .beam { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .proj.soon .shape { animation: blink 1.8s steps(2, jump-none) infinite; }
    @keyframes blink { 50% { stroke-opacity: .35; } }
}
</style>
</head>

const M = {l:112, r:20, t:14};

function size(){
  const el=svg.node(); W=el.clientWidth; H=el.clientHeight;

// beeswarm offsets computed at the base scale; zoom only stretches x
function swarm(){
  const base = x0.copy();
  visibleLanes.forEach((l,i)=>{
    const ns = items.filter(d=>d.area===l.id);
    const cy = laneTop + i*laneH + laneH/2;
    ns.forEach(d=>{d.r = Math.min(3.2+Math.sqrt(d.lines)*0.24,8); d.bx=base(d.t); d.x=d.bx; d.y=cy; d.cy=cy;});
    const sim=d3.forceSimulation(ns).force('x',d3.forceX(d=>d.bx).strength(1)).force('y',d3.forceY(cy).strength(0.08))
      .force('c',d3.forceCollide(d=>d.r+1.2)).stop();
    for(let k=0;k<120;k++) sim.tick();
    ns.forEach(d=>{ d.dy=Math.max(-laneH/2+d.r+2,Math.min(laneH/2-d.r-2,d.y-cy)); });
  });
}

function shapePath(r){ return `M0 ${-r} L${r} 0 L0 ${r} L${-r} 0 Z`; }

function render(){

    .attr('x',12).attr('y',(d,i)=>laneTop+i*laneH+laneH/2+4).attr('fill',d=>laneColor(d.id)).text(d=>d.name);

  const allDone = done.filter(d=>shownLanes.has(d.area)).sort((a,b)=>a.t-b.t);
  const allProj = proj.filter(d=>shownLanes.has(d.area)).sort((a,b)=>a.t-b.t);
  let c=0; const cum=[{t:x0.domain()[0],v:0}]; allDone.forEach(d=>cum.push({t:d.t,v:++c})); cum.push({t:NOW,v:c});
  const pc=[{t:NOW,v:c}]; let p=c; allProj.forEach(d=>pc.push({t:d.t,v:++p}));
  const total = Math.max(p,1);
  const yC = d3.scaleLinear().domain([0,total]).range([M.t+CHART_H, M.t+8]);
  const area = d3.area().curve(d3.curveStepAfter).x(d=>x(d.t)).y0(M.t+CHART_H).y1(d=>yC(d.v));
  gChart.selectAll('path.area-done').data([cum]).join('path').attr('class','area-done').attr('d',area);
  gChart.selectAll('path.area-proj').data([pc]).join('path').attr('class','area-proj').attr('d',area)
    .attr('opacity',shownKinds.has('projected')?1:0);
  gLabels.selectAll('text.chart-label').data([0]).join('text').attr('class','chart-label').attr('x',12).attr('y',M.t+14).text('Docs closed');
  gLabels.selectAll('text.readout').data([[c,total]]).join('text').attr('class','readout').attr('x',12).attr('y',M.t+32)
    .text(d=>`${d[0]} / ${d[1]}`);
  gChart.selectAll('line.base').data([0]).join('line').attr('class','base gridline year').attr('x1',M.l).attr('x2',W-M.r).attr('y1',M.t+CHART_H).attr('y2',M.t+CHART_H);

  // milestones
  const mil = gMil.selectAll('g.mil').data(DATA.milestones).join(enter=>{const g=enter.append('g').attr('class','mil');g.append('line');g.append('path').attr('class','dia');g.append('text');g.append('title');return g;});
  mil.attr('transform',d=>`translate(${x(parse(d.date))},0)`).attr('display',d=>shownKinds.has('projected')?null:'none');
  mil.select('line').attr('y1',M.t+CHART_H+8).attr('y2',H-24);
  mil.select('path').attr('d',`M0 ${M.t+CHART_H+2} l6 6 l-6 6 l-6 -6 Z`);
  mil.select('text').attr('x',9).attr('y',M.t+CHART_H+12).text(d=>d.label);
  mil.select('title').text(d=>`${d.label}, ${d.date}: ${d.note}`);

  // now beam
  const nx=x(NOW);
  gNow.selectAll('rect.beam').data([0]).join('rect').attr('class','beam').attr('x',nx-60).attr('width',60).attr('y',M.t).attr('height',H-24-M.t);
  gNow.selectAll('line').data([0]).join('line').attr('x1',nx).attr('x2',nx).attr('y1',M.t).attr('y2',H-24).attr('filter','url(#glow)');
  gNow.selectAll('text').data([0]).join('text').attr('x',nx+6).attr('y',H-30).text(`NOW ${DATA.now}`);

  // windows
  const vis = d=>shownLanes.has(d.area)&&shownKinds.has(d.kind);
  const laneIndex = Object.fromEntries(visibleLanes.map((l,i)=>[l.id,i]));
  gWin.selectAll('line').data(proj.filter(vis),d=>d.id).join('line').attr('class','win')
    .attr('stroke',d=>laneColor(d.area)).attr('x1',d=>x(d.lo)).attr('x2',d=>x(d.hi)).attr('y1',d=>d.cy+d.dy).attr('y2',d=>d.cy+d.dy);

  // markers
  const dots = gDots.selectAll('g.dot').data(items.filter(vis),d=>d.id).join(enter=>{
    const g=enter.append('g').attr('class',d=>'dot'+(d.kind==='projected'?' proj':'')+(d.kind==='projected'&&(d.t-NOW)<1000*3600*24*45?' soon':''))
      .attr('tabindex',0).attr('role','button').attr('aria-label',d=>`${d.id}, ${STATE_LABEL[d.state]}, ${d.date}`);
    g.append('path').attr('class','shape');
    g.each(function(d){
      const s=d3.select(this), col=laneColor(d.area);
      s.select('.shape').attr('d',shapePath(d.r)).attr('fill',d.kind==='archived'&&d.state==='done'?col:'var(--void)').attr('stroke',col)
        .attr('stroke-width',d.kind==='archived'&&d.state==='done'?0:1.6).attr('filter',d.kind==='archived'&&d.state==='done'?'url(#glow)':null);
      const k=d.r*0.5;
      if(d.state==='wont') s.append('path').attr('d',`M${-k} ${-k} L${k} ${k} M${k} ${-k} L${-k} ${k}`).attr('stroke',col).attr('stroke-width',1.3);
      if(d.state==='superseded') s.append('path').attr('d',`M${-k} ${k} L${k} ${-k}`).attr('stroke',col).attr('stroke-width',1.3);
    });
    g.on('click',(ev,d)=>{ev.stopPropagation();inspect(d);}).on('keydown',(ev,d)=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();inspect(d);}});
    return g;
  });
  dots.attr('transform',d=>`translate(${x(d.t)},${d.cy+d.dy})`).classed('sel',d=>selected&&d.id===selected.id);
}

// ---------- zoom ----------
let currentT = d3.zoomIdentity;
const zoom = d3.zoom().scaleExtent([1,40]).on('zoom',ev=>{ currentT=ev.transform; x=currentT.rescaleX(x0); render(); });
svg.call(zoom).on('dblclick.zoom',null);
svg.on('click',()=>{ selected=null; document.getElementById('insp').hidden=true; render(); });
function applyExtent(){ zoom.translateExtent([[M.l-40,0],[W-M.r+40,H]]).extent([[M.l,0],[W-M.r,H]]); }

// ---------- inspector ----------
const insp=document.getElementById('insp');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inspect(d){
  selected=d; render();
  const col=laneColor(d.area);
  const when = d.kind==='archived'
    ? `<dt>Closed</dt><dd>${d.date}</dd>`
    : `<dt>ETA</dt><dd>${d.date}</dd><dt>Window</dt><dd>${fmt(d.lo)} to ${fmt(d.hi)}</dd>`;
  insp.innerHTML=`<div class="row"><span class="tag" style="color:${col}">${esc(laneName[d.area])}</span><span class="tag" style="color:${d.kind==='archived'?'var(--green)':'var(--red)'}">${esc(STATE_LABEL[d.state])}</span><button class="close iconbtn" type="button" aria-label="Close">&times;</button></div>
    <h2>${esc(d.title)}</h2>
    <div class="fid">${esc(d.path)}</div>
    <dl class="when">${when}</dl>
    ${d.kind==='projected'?'<div class="guess">ETA is a guess from pace and priority order, not a plan.</div>':''}
    ${d.status?`<p>${esc(d.status)}</p>`:''}`;
  insp.hidden=false;
  insp.querySelector('.close').onclick=()=>{insp.hidden=true;selected=null;render();};
}

// ---------- boot ----------
function boot(){
  size(); applyExtent();
  // open on the whole history and the next 9 months of projections
  const a=d3.timeDay.offset(first,-10), b=d3.timeMonth.offset(NOW,9);
  const k=(x0.range()[1]-x0.range()[0])/(x0(b)-x0(a));
  const t=d3.zoomIdentity.translate(M.l-k*x0(a),0).scale(k);
  svg.call(zoom.transform,t);
}
boot();
window.addEventListener('resize',()=>{ size(); applyExtent(); x=currentT.rescaleX(x0); render(); });
</script>
</body>
