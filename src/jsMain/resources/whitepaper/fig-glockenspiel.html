<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The glockenspiel as a signal graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
    :root {
        color-scheme: dark;
        --paper: #191C22;
        --surface: #21252B;
        --surface-2: #2C313A;
        --ink: #D7DADF;
        --muted: #ABB2BF;
        --faint: #5C6370;
        --rule: #353A42;
        --rule-soft: #2C313A;
        --spark: #D19A66;
        --spark-bg: #362820;
        --signal: #56B6C2;
        --signal-bg: #1A2A30;
        --gold: #E8B84B;
        --code-bg: #12131C;
        --code-str: #98C379;
        --code-cm: #5C6370;
        --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
        --f-body: Charter, "Bitstream Charter", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --f-mono: "Share Tech Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        margin: 0;
        padding: 2px 2px 4px;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--f-body);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
    code, .mono { font-family: var(--f-mono); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    figure { margin: 0; display: flex; flex-direction: column; gap: 12px; }
    code { font-family: var(--f-mono); font-size: 0.86em; }
    .lab { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }

    /* ---- graph and envelope, side by side ---- */
    .top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
    @media (min-width: 720px) {
        .top { grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 20px 26px; }
    }
    .graph { display: block; width: 100%; height: auto; max-width: 340px; }
    .graph .bx { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
    .graph .bx-eng { fill: var(--spark-bg); stroke: var(--spark); stroke-width: 1; }
    .graph .bx-env { fill: rgba(232, 184, 75, 0.14); stroke: var(--gold); stroke-width: 1; }
    .graph .bx-classic { fill: none; stroke: var(--spark); stroke-width: 1; stroke-dasharray: 4 3; }
    .graph .arw { stroke: var(--muted); stroke-width: 1.2; fill: none; }
    .graph .t { font-family: var(--f-mono); font-size: 10.5px; fill: var(--ink); }
    .graph .t-sm { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
    .graph .t-xs { font-family: var(--f-mono); font-size: 9.5px; fill: var(--muted); }
    .graph .nd { transition: opacity .12s; }
    .graph .nd[data-env] { cursor: pointer; }
    .graph .nd:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
    .graph .nd.hl rect, .graph .nd.hl circle { stroke: var(--ink); stroke-width: 2; }
    .graph .nd.sel rect { stroke-width: 2.5; fill: rgba(232, 184, 75, 0.34); }
    .has-hl .graph .nd:not(.hl) { opacity: 0.4; }

    /* ---- the envelope panel ---- */
    .env { min-width: 0; }
    @media (max-width: 719px) { .env { border-top: 1px solid var(--rule); padding-top: 14px; } }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
    .tab {
        appearance: none;
        font-family: var(--f-mono);
        font-size: 12.5px;
        color: var(--ink);
        background: var(--code-bg);
        border: 1px solid var(--rule);
        border-radius: 0;
        padding: 5px 10px 4px;
        cursor: pointer;
    }
    .tab[aria-pressed="true"] { border-color: var(--gold); background: rgba(232, 184, 75, 0.14); }
    .envnote { margin: 0 0 12px; font-size: 15px; line-height: 1.45; color: var(--muted); max-width: 46em; }
    .envnote { min-height: 2.9em; }
    @media (max-width: 719px) { .envnote { min-height: 4.4em; } }
    .chartwrap { min-width: 0; }
    .chart { display: block; width: 100%; height: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
    .chart .axis { stroke: var(--faint); stroke-width: 1; }
    .chart .grid { stroke: var(--rule); stroke-width: 1; }
    .chart .ax { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); pointer-events: none; }
    .chart .curve { fill: none; stroke: var(--gold); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .chart .area { fill: rgba(232, 184, 75, 0.12); stroke: none; }
    .chart .ghost { fill: none; stroke: var(--faint); stroke-width: 1.4; stroke-dasharray: 4 4; }
    .chart .gate { stroke: var(--signal); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .chart .gatelab { font-family: var(--f-mono); font-size: 11px; fill: var(--signal); pointer-events: none; }
    .chart .guide { stroke: var(--faint); stroke-width: 1; stroke-dasharray: 2 4; }
    .chart .cross { stroke: var(--ink); stroke-width: 1; opacity: 0.5; pointer-events: none; }
    .chart .h { fill: var(--paper); stroke: var(--gold); stroke-width: 2; cursor: grab; }
    .chart .h.g { stroke: var(--signal); }
    .chart .hit { fill: transparent; cursor: grab; touch-action: none; }
    .chart .hl { font-family: var(--f-mono); font-size: 10.5px; fill: var(--gold); pointer-events: none; }
    .chart .hl.g { fill: var(--signal); }
    .readouts { margin: 6px 0 0; font-family: var(--f-mono); font-size: 12px; line-height: 1.5; color: var(--muted); }
    .readouts .probe { color: var(--ink); min-height: 1.5em; }
    .ctrls { display: none; grid-template-columns: repeat(auto-fit, minmax(138px, 1fr)); gap: 8px 22px; align-items: end; margin-top: 12px; }
    .js .ctrls { display: grid; }
    .tabs { display: none; }
    .js .tabs { display: flex; }
    .row { display: flex; flex-direction: column; gap: 0; }
    .row .hd { display: flex; justify-content: space-between; align-items: baseline; }
    .row label { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink); }
    .row output { font-family: var(--f-mono); font-size: 12.5px; color: var(--gold); text-align: right; }
    .row.gate label, .row.gate output { color: var(--signal); }
    input[type="range"] { width: 100%; margin: 0; accent-color: var(--gold); background: transparent; height: 24px; }
    .row.gate input[type="range"] { accent-color: var(--signal); }
    .call { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink); background: var(--code-bg); border: 1px solid var(--rule); padding: 6px 8px; overflow-wrap: anywhere; }
    .call .st { color: var(--code-str); }
    .callrow { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: stretch; }
    .callrow .call { flex: 1 1 200px; }
    .reset {
        appearance: none;
        font-family: var(--f-mono); font-size: 12px; color: var(--muted);
        background: transparent; border: 1px solid var(--rule); border-radius: 0; padding: 4px 10px 3px; cursor: pointer;
    }
    .reset:hover { color: var(--ink); border-color: var(--muted); }
    .foot { margin: 0; font-family: var(--f-mono); font-size: 12px; line-height: 1.5; color: var(--muted); }
    .hint { margin: 8px 0 0; }
    .js-only { display: none; }
    .js .js-only { display: block; }
    .js .nojs { display: none; }

</style>
<script>document.documentElement.className = "js";</script>
</head>

    <p class="foot">Every stage is drawn with the engine's default curve, exponential: (e<sup>3x</sup> &minus; 1) / (e<sup>3</sup> &minus; 1). The release falls from the level the envelope has when the gate closes. The gate is a sketch value: your pattern sets it, and 0.5 s is one step of <code>note("c5 e5 g5 c6")</code> at the default tempo of 0.5 cycles per second.</p>

<script>

(function () {
    "use strict";

    // ---- the envelope law: audio_be/EnvelopeCore.kt (adsAt, releaseAt), audio_be/AdsrCurveMath.kt (adsrExpShape) ----
    var K = 3.0;                                  // ADSR_EXP_K, audio_bridge/constants/EnvelopeDefaults.kt
    var NORM = 1 / (Math.exp(K) - 1);
    function G(x) { return (Math.exp(K * x) - 1) * NORM; }

    var DEFAULTS = {                              // the three adsr(...) calls of the listing
        amp:   { a: 0.001, d: 1.5,  s: 0, r: 0.3 },
        cut:   { a: 0.001, d: 0.8,  s: 0, r: 0.1 },
        noise: { a: 0.001, d: 0.02, s: 0, r: 0.005 }
    };
    var GATE_DEFAULT = 0.5;
    var NOTES = {
        amp:   "The loudness envelope: the whole sum passes through it.",
        cut:   "The low-pass cutoff is 8000 Hz plus 4000 Hz times this envelope: 12000 Hz at the peak, 8000 Hz at level 0.",
        noise: "The envelope on the noise burst that stands for the strike."
    };

    function copy(o) { return { a: o.a, d: o.d, s: o.s, r: o.r }; }
    var state = { amp: copy(DEFAULTS.amp), cut: copy(DEFAULTS.cut), noise: copy(DEFAULTS.noise) };
    var gate = GATE_DEFAULT;
    var cur = "amp";
    var frozenT = null;

    function ads(e, t) {
        if (e.a > 0 && t < e.a) { return G(t / e.a); }
        if (e.d > 0 && t < e.a + e.d) { return e.s + (1 - e.s) * G(1 - (t - e.a) / e.d); }
        return e.s;
    }
    function gateLevel(e) { return gate <= 0 ? 0 : ads(e, gate); }
    function lvl(e, t) {
        if (t < gate) { return ads(e, t); }
        if (e.r <= 0) { return 0; }
        var p = (t - gate) / e.r;
        if (p >= 1) { return 0; }
        return gateLevel(e) * G(1 - p);
    }
    function windowT(e) {
        var ad = e.a + e.d;
        var T = gateLevel(e) > 0.001 ? Math.max(ad, gate + e.r) : ad;
        return Math.max(T, 0.002) * 1.06;
    }

    // ---- number helpers ----
    function snap(v) {
        if (v < 0.0005) { return 0; }
        return Number(v.toPrecision(2));
    }
    function posToTime(p) { return p <= 0 ? 0 : 0.001 * Math.pow(3000, (p - 1) / 999); }
    function timeToPos(v) {
        if (v <= 0) { return 0; }
        var p = 1 + 999 * Math.log(v / 0.001) / Math.log(3000);
        return Math.max(1, Math.min(1000, Math.round(p)));
    }
    function fmtSec(v) { return v === 0 ? "0 s" : v + " s"; }
    function fmtArg(v) { return Number.isInteger(v) ? v.toFixed(1) : String(v); }
    function tickLabel(t, ms) {
        var v = ms ? t * 1000 : t;
        return String(Number(v.toPrecision(3)));
    }
    function niceStep(T) {
        var raw = T / 4;
        var p = Math.pow(10, Math.floor(Math.log10(raw)));
        var m = raw / p;
        var n = m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10;
        return n * p;
    }

    // ---- elements ----
    var fig = document.getElementById("fig");
    var svg = document.getElementById("chart");
    var status = document.getElementById("status");
    var probe = document.getElementById("probe");
    var envnote = document.getElementById("envnote");
    var callout = document.getElementById("callout");
    var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
    var sl = {
        a: document.getElementById("s-a"), d: document.getElementById("s-d"),
        s: document.getElementById("s-s"), r: document.getElementById("s-r"), g: document.getElementById("s-g")
    };
    var out = {
        a: document.getElementById("o-a"), d: document.getElementById("o-d"),
        s: document.getElementById("o-s"), r: document.getElementById("o-r"), g: document.getElementById("o-g")
    };

    // ---- chart ----
    var geo = null;   // the last layout: {W, H, L, top, PW, PH, T}

    function draw() {
        var e = state[cur];
        var W = Math.max(280, Math.round(svg.parentNode.clientWidth));
        var H = W < 460 ? 196 : 214;
        var cutTab = cur === "cut";
        var L = 40, R = cutTab ? 60 : 16, top = 16, bottom = 32;
        var PW = W - L - R, PH = H - top - bottom;
        var T = frozenT !== null ? frozenT : windowT(e);
        var ms = T < 0.2;
        function X(t) { return L + t / T * PW; }
        function Y(v) { return top + PH * (1 - v); }
        geo = { W: W, H: H, L: L, top: top, PW: PW, PH: PH, T: T, R: R };

        var Lg = gateLevel(e);
        var eps = T * 1e-6;
        var ts = [];
        var N = 260, i;
        for (i = 0; i <= N; i++) { ts.push(T * i / N); }
        [e.a, e.a + e.d, gate, gate + e.r].forEach(function (b) {
            if (b >= 0 && b <= T) { ts.push(b - eps, b, b + eps); }
        });
        ts = ts.filter(function (t) { return t >= 0 && t <= T; }).sort(function (x, y) { return x - y; });

        var p = [], ghost = [];
        ts.forEach(function (t) {
            p.push(X(t).toFixed(1) + "," + Y(lvl(e, t)).toFixed(1));
            if (t >= gate) { ghost.push(X(t).toFixed(1) + "," + Y(ads(e, t)).toFixed(1)); }
        });
        var curve = "M" + p.join(" L");
        var area = curve + " L" + X(ts[ts.length - 1]).toFixed(1) + "," + Y(0) + " L" + X(0).toFixed(1) + "," + Y(0) + " Z";

        var m = [];
        m.push('<line class="axis" x1="' + L + '" y1="' + Y(0) + '" x2="' + (W - R) + '" y2="' + Y(0) + '"/>');
        m.push('<line class="axis" x1="' + L + '" y1="' + top + '" x2="' + L + '" y2="' + Y(0) + '"/>');
        m.push('<text class="ax" x="' + (L - 7) + '" y="' + (Y(1) + 4) + '" text-anchor="end">1</text>');
        m.push('<text class="ax" x="' + (L - 7) + '" y="' + (Y(0) + 4) + '" text-anchor="end">0</text>');
        if (cutTab) {
            m.push('<text class="ax" x="' + (W - R + 6) + '" y="' + (Y(1) + 4) + '">12000 Hz</text>');
            m.push('<text class="ax" x="' + (W - R + 6) + '" y="' + (Y(0) + 4) + '">8000 Hz</text>');
        }
        var step = niceStep(T);
        for (var tk = 0; tk <= T + step * 1e-6; tk += step) {
            m.push('<line class="grid" x1="' + X(tk).toFixed(1) + '" y1="' + Y(0) + '" x2="' + X(tk).toFixed(1) + '" y2="' + (Y(0) + 4) + '"/>');
            m.push('<text class="ax" x="' + X(tk).toFixed(1) + '" y="' + (Y(0) + 17) + '" text-anchor="middle">' + tickLabel(tk, ms) + '</text>');
        }
        m.push('<text class="ax" x="' + (W - R) + '" y="' + (Y(0) + 29) + '" text-anchor="end">time (' + (ms ? "ms" : "s") + ')</text>');
        m.push('<line class="guide" x1="' + L + '" y1="' + Y(e.s) + '" x2="' + (W - R) + '" y2="' + Y(e.s) + '"/>');
        if (ghost.length > 1 && gate < T) { m.push('<path class="ghost" d="M' + ghost.join(" L") + '"/>'); }
        m.push('<path class="area" d="' + area + '"/>');
        m.push('<path class="curve" d="' + curve + '"/>');

        // the gate: a marker line, or a note at the right edge when it lies beyond the window
        var gx = X(Math.min(gate, T));
        var gOff = gate > T;
        m.push('<line class="gate" x1="' + gx.toFixed(1) + '" y1="' + top + '" x2="' + gx.toFixed(1) + '" y2="' + Y(0) + '"/>');
        var glabel = gOff ? "gate at " + fmtSec(gate) + " ▸" : "gate";
        m.push('<text class="gatelab" x="' + (gOff ? gx - 6 : gx + 6).toFixed(1) + '" y="' + (top + 10) + '" text-anchor="' + (gOff ? "end" : "start") + '">' + glabel + '</text>');

        // handles: a hit area and a mark each. A and D and R move in time, S in level, the gate in time.
        function handle(id, x, y, label, gateStyle, lx, ly, anchor) {
            m.push('<circle class="h' + (gateStyle ? " g" : "") + '" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5.5"/>');
            m.push('<text class="hl' + (gateStyle ? " g" : "") + '" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '">' + label + '</text>');
            m.push('<circle class="hit" data-h="' + id + '" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="15"/>');
        }
        handle("a", X(e.a), Y(1), "A", false, X(e.a) + 10, Y(1) + 4, "start");
        if (e.d > 0 || true) { handle("d", X(e.a + e.d), Y(e.s), "D", false, X(e.a + e.d) + 9, Y(e.s) - 8, "start"); }
        handle("s", L, Y(e.s), "S", false, L + 10, Y(e.s) - 8, "start");
        if (Lg > 0.001 && gate + e.r <= T) { handle("r", X(gate + e.r), Y(0), "R", false, X(gate + e.r) + 9, Y(0) - 8, "start"); }
        handle("g", gx, top + 20, "", true, gx, top + 20, "middle");

        m.push('<line class="cross" id="cross" x1="0" y1="' + top + '" x2="0" y2="' + Y(0) + '" style="display:none"/>');
        svg.setAttribute("viewBox", "0 0 " + W + " " + H);
        svg.innerHTML = m.join("");
        svg.setAttribute("aria-label", "The " + describe() + " envelope: attack " + fmtSec(e.a) + ", decay " + fmtSec(e.d) + ", sustain " + e.s + ", release " + fmtSec(e.r) + ", with the gate closing at " + fmtSec(gate) + ".");
    }

    function describe() { return cur === "amp" ? "loudness" : cur === "cut" ? "filter cutoff" : "noise burst"; }

    // ---- controls ----
    function syncCtrls() {
        var e = state[cur];
        sl.a.value = timeToPos(e.a); out.a.textContent = fmtSec(e.a); sl.a.setAttribute("aria-valuetext", fmtSec(e.a));
        sl.d.value = timeToPos(e.d); out.d.textContent = fmtSec(e.d); sl.d.setAttribute("aria-valuetext", fmtSec(e.d));
        sl.s.value = Math.round(e.s * 1000); out.s.textContent = String(e.s); sl.s.setAttribute("aria-valuetext", String(e.s));
        sl.r.value = timeToPos(e.r); out.r.textContent = fmtSec(e.r); sl.r.setAttribute("aria-valuetext", fmtSec(e.r));
        sl.g.value = timeToPos(gate); out.g.textContent = fmtSec(gate); sl.g.setAttribute("aria-valuetext", fmtSec(gate));

        callout.textContent = "";
        callout.appendChild(document.createTextNode(".adsr(" + [e.a, e.d, e.s, e.r].map(fmtArg).join(", ") + ")"));

        var Lg = gateLevel(e);
        var msg;
        if (gate <= 0) {
            msg = "The gate closes at 0 s, before the envelope can start, so it stays at 0.";
        } else if (Lg > 0.001) {
            msg = "Level at the gate: " + (Math.round(Lg * 100) / 100) + ". The release starts from there.";
        } else {
            msg = "Level at the gate: 0. The release has nothing to fall from, so the sound has already ended.";
        }
        status.textContent = msg;
        envnote.textContent = NOTES[cur];
    }

    function refresh() { syncCtrls(); draw(); }

    function select(name) {
        cur = name;
        tabs.forEach(function (t) { t.setAttribute("aria-pressed", t.getAttribute("data-env") === name ? "true" : "false"); });
        Array.prototype.forEach.call(document.querySelectorAll("[data-env]"), function (n) {
            if (n.classList.contains("tab")) { return; }
            n.classList.toggle("sel", n.getAttribute("data-env") === name);
        });
        refresh();
    }

    tabs.forEach(function (t) { t.addEventListener("click", function () { select(t.getAttribute("data-env")); }); });
    Array.prototype.forEach.call(document.querySelectorAll(".nd[data-env]"), function (n) {
        n.addEventListener("click", function () { select(n.getAttribute("data-env")); });
        n.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.getAttribute("data-env")); }
        });
    });

    function onSlider(key) {
        return function () {
            var v = Number(sl[key].value);
            var e = state[cur];
            if (key === "s") { e.s = Math.round(v) / 1000; e.s = Math.round(e.s * 100) / 100; }
            else if (key === "g") { gate = snap(posToTime(v)); }
            else { e[key] = snap(posToTime(v)); }
            refresh();
        };
    }
    ["a", "d", "s", "r", "g"].forEach(function (k) { sl[k].addEventListener("input", onSlider(k)); });
    document.getElementById("reset").addEventListener("click", function () {
        state[cur] = copy(DEFAULTS[cur]);
        gate = GATE_DEFAULT;
        refresh();
    });

    // ---- dragging the handles on the curve ----
    var drag = null;
    function svgPoint(ev) {
        var r = svg.getBoundingClientRect();
        var sx = geo.W / r.width, sy = geo.H / r.height;
        return { x: (ev.clientX - r.left) * sx, y: (ev.clientY - r.top) * sy };
    }
    function onMove(ev) {
        if (!drag) { return; }
        var e = state[cur];
        var pt = svgPoint(ev);
        var t = Math.max(0, Math.min(3, (pt.x - geo.L) / geo.PW * geo.T));
        if (drag === "a") { e.a = snap(t); }
        else if (drag === "d") { e.d = snap(Math.max(0, t - e.a)); }
        else if (drag === "r") { e.r = snap(Math.max(0, t - gate)); }
        else if (drag === "g") { gate = snap(t); }
        else if (drag === "s") {
            var v = (geo.top + geo.PH - pt.y) / geo.PH;
            e.s = Math.round(Math.max(0, Math.min(1, v)) * 100) / 100;
        }
        refresh();
    }
    function onUp() {
        drag = null;
        frozenT = null;
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        refresh();
    }
    svg.addEventListener("pointerdown", function (ev) {
        var h = ev.target && ev.target.getAttribute ? ev.target.getAttribute("data-h") : null;
        if (!h) { return; }
        ev.preventDefault();
        drag = h;
        frozenT = geo.T;
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
    });

    // ---- the probe: level under the pointer ----
    svg.addEventListener("pointermove", function (ev) {
        if (drag || !geo) { return; }
        var pt = svgPoint(ev);
        var cross = document.getElementById("cross");
        if (pt.x < geo.L || pt.x > geo.L + geo.PW) {
            if (cross) { cross.style.display = "none"; }
            probe.textContent = "";
            return;
        }
        var t = (pt.x - geo.L) / geo.PW * geo.T;
        var e = state[cur];
        var v = lvl(e, t);
        if (cross) { cross.setAttribute("x1", pt.x); cross.setAttribute("x2", pt.x); cross.style.display = ""; }
        var txt = "at " + Number((geo.T < 0.2 ? t * 1000 : t).toPrecision(3)) + (geo.T < 0.2 ? " ms" : " s") + ": level " + v.toFixed(2);
        if (cur === "cut") { txt += ", cutoff " + Math.round(8000 + 4000 * v) + " Hz"; }
        probe.textContent = txt;
    });
    svg.addEventListener("pointerleave", function () {
        var cross = document.getElementById("cross");
        if (cross) { cross.style.display = "none"; }
        probe.textContent = "";
    });

    // ---- hover, focus or tap a node: its branch lights, the rest dims ----
    var linked = Array.prototype.slice.call(document.querySelectorAll(".graph [data-l]"));
    var pinned = null, touched = false;
    function highlight(ids) {
        fig.classList.toggle("has-hl", !!ids);
        linked.forEach(function (n) {
            var mine = n.getAttribute("data-l").split(" ");
            var on = !!ids && mine.some(function (x) { return ids.indexOf(x) >= 0; });
            n.classList.toggle("hl", on);
        });
    }
    linked.forEach(function (n) {
        var ids = n.getAttribute("data-l").split(" ");
        n.addEventListener("mouseenter", function () { if (!pinned) { highlight(ids); } });
        n.addEventListener("mouseleave", function () { if (!pinned) { highlight(null); } });
        n.addEventListener("focus", function () { if (!pinned) { highlight(ids); } });
        n.addEventListener("blur", function () { if (!pinned) { highlight(null); } });
        n.addEventListener("pointerdown", function (ev) { touched = ev.pointerType === "touch"; });
        n.addEventListener("click", function () {
            // a tap keeps the branch lit (there is no hover on a phone); a second tap lets go
            if (!touched) { return; }
            pinned = pinned === n ? null : n;
            highlight(pinned ? ids : null);
        });
    });
    document.querySelector(".graph").addEventListener("click", function (ev) {
        if (!ev.target.closest || !ev.target.closest(".nd")) { pinned = null; highlight(null); }
    });

    // ---- keep the chart the width of its column ----
    var lastW = 0;
    if (window.ResizeObserver) {
        new ResizeObserver(function () {
            var w = svg.parentNode.clientWidth;
            if (w && w !== lastW) { lastW = w; draw(); }
        }).observe(svg.parentNode);
    } else {
        window.addEventListener("resize", draw);
    }

    select("amp");

    // ---- report the content height to the host page ----
    var last = 0;
    function report() {
        var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
        if (h && h !== last) {
            last = h;
            try { window.parent.postMessage({ type: "klang-figure-height", height: h }, "*"); } catch (e) { /* no host */ }
        }
    }
    window.addEventListener("load", report);
    window.addEventListener("resize", report);
    if (window.ResizeObserver) { new ResizeObserver(report).observe(document.body); }
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(report); }
    report();
})();

</script>
</body>
</html>
