<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From text to sound in four steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
    /* Tokens copied from the whitepaper's :root (the Klang UI palette, dark only). */
    :root {
        color-scheme: dark;
        --paper: #191C22;
        --surface: #21252B;
        --surface-2: #2C313A;
        --ink: #D7DADF;
        --muted: #ABB2BF;
        --faint: #5C6370;
        --rule: #353A42;
        --spark: #D19A66;
        --spark-bg: #362820;
        --signal: #56B6C2;
        --signal-bg: #1A2A30;
        --gold: #E8B84B;
        --code-bg: #12131C;

        --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
        --f-body: Charter, "Bitstream Charter", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --f-mono: "Share Tech Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--f-body);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }

    .fig { display: flow-root; padding: 2px 0 6px; }

    button, input { font: inherit; }

    :focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }

    /* ---------- controls ---------- */
    .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 22px;
        margin: 0 0 8px;
        font-family: var(--f-mono);
        font-size: 12.5px;
        color: var(--muted);
    }
    .no-js .controls { display: none; }

    .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
    .ctl label, .ctl .lab { color: var(--ink); }
    .ctl output { color: var(--signal); min-width: 4.4em; display: inline-block; }

    input[type="range"] { width: 200px; max-width: 100%; accent-color: var(--signal); height: 24px; margin: 0; }

    .chip {
        background: var(--surface);
        color: var(--muted);
        border: 1px solid var(--rule);
        padding: 3px 9px;
        font-family: var(--f-mono);
        font-size: 12px;
        line-height: 1.4;
        cursor: pointer;
    }
    .chip:hover { border-color: var(--signal); color: var(--ink); }
    .chip[aria-pressed="true"] { border-color: var(--signal); background: var(--signal-bg); color: var(--ink); }

    .summary {
        font-family: var(--f-mono);
        font-size: 12.5px;
        color: var(--muted);
        margin: 0 0 14px;
        min-height: 1.5em;
    }
    .summary b { color: var(--ink); font-weight: 400; }

    /* ---------- the four steps ---------- */
    .flow {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        row-gap: 6px;
    }

    .thread {
        font-family: var(--f-mono);
        font-size: 10.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 0 0 2px;
        margin-top: 4px;
    }
    .thread.lang { color: var(--signal); }
    .thread.eng { color: var(--spark); }

    .step {
        position: relative;
        background: var(--signal-bg);
        border: 1px solid var(--signal);
        padding: 12px 12px 12px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 9px;
    }
    .step.eng { background: var(--spark-bg); border-color: var(--spark); }

    .step h2 {
        font-family: var(--f-display);
        font-weight: 700;
        font-size: 17px;
        letter-spacing: -0.01em;
        line-height: 1.15;
        margin: 0;
        display: flex;
        align-items: baseline;
        gap: 9px;
        color: var(--ink);
    }
    .step .n {
        font-family: var(--f-mono);
        font-weight: 400;
        font-size: 12px;
        color: var(--signal);
        border: 1px solid var(--signal);
        width: 20px;
        height: 20px;
        line-height: 18px;
        text-align: center;
        flex: none;
        position: relative;
        top: -1px;
    }
    .step.eng .n { color: var(--spark); border-color: var(--spark); }

    .what { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--muted); }

    .panel {
        background: var(--code-bg);
        border: 1px solid var(--rule);
        padding: 8px 9px;
        min-width: 0;
    }

    code.src {
        font-family: var(--f-mono);
        font-size: 12.5px;
        color: var(--ink);
        background: none;
        border: 0;
        padding: 0;
        overflow-wrap: anywhere;
    }
    .st { color: #98C379; }

    svg.strip { display: block; width: 100%; max-width: 440px; height: auto; }
    svg.strip text { font-family: var(--f-mono); }
    .strip .tick { stroke: var(--faint); stroke-width: 1; }
    .strip .axis { stroke: var(--muted); stroke-width: 1; }
    .strip .tl { font-size: 9px; fill: var(--muted); }
    .strip .tl.u { fill: var(--faint); }
    .strip .cyc { stroke: var(--faint); stroke-width: 1; stroke-dasharray: 2 3; }
    .strip .bar.on { fill: var(--signal); }
    .strip .bar.off { fill: var(--signal); opacity: 0.28; }
    .strip .bar-t { font-size: 10px; fill: var(--paper); }
    .strip .cell { fill: var(--spark-bg); stroke: var(--spark); stroke-width: 1; }
    .strip .cell-t { font-size: 10px; fill: var(--spark); text-anchor: middle; }
    .strip .dim { stroke: var(--muted); stroke-width: 1; fill: none; }
    .strip .dim-t { font-size: 9px; fill: var(--muted); text-anchor: middle; }
    .strip .more { fill: var(--signal); }

    table.rows {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--f-mono);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
    }
    table.rows th {
        font-weight: 400;
        text-align: left;
        color: var(--muted);
        padding: 0 6px 3px 0;
        border-bottom: 1px solid var(--rule);
        white-space: nowrap;
    }
    table.rows td { padding: 3px 6px 0 0; color: var(--ink); white-space: nowrap; }
    table.rows th.r, table.rows td.r { text-align: right; padding-right: 0; }
    table.rows td:first-child { color: var(--gold); }
    .u { color: var(--faint); }

    .kv { font-family: var(--f-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .kv .g { color: var(--gold); margin-top: 7px; }
    .kv .g:first-child { margin-top: 0; }
    .kv .row { display: flex; justify-content: space-between; gap: 8px; padding-left: 10px; color: var(--ink); }
    .kv .row span:first-child { color: var(--muted); }
    .kv .row span:last-child { text-align: right; white-space: nowrap; }
    i.u { font-style: normal; color: var(--faint); }

    .breakdown { margin: 0; display: flex; flex-direction: column; gap: 6px; }
    .breakdown dt { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink); }
    .breakdown dd { margin: 0; font-size: 13px; line-height: 1.4; color: var(--muted); }

    .note {
        margin: 0;
        font-family: var(--f-mono);
        font-size: 11.5px;
        line-height: 1.5;
        color: var(--muted);
    }
    .note b { color: var(--ink); font-weight: 400; }

    .tag {
        margin: auto 0 0;
        padding-top: 8px;
        border-top: 1px solid var(--rule);
        font-family: var(--f-body);
        font-size: 12.5px;
        line-height: 1.4;
        color: var(--muted);
    }
    .tag.hot { color: var(--ink); border-top-color: var(--signal); }

    .step.pulse .panel.live { animation: pulse 0.9s ease-out; }
    @keyframes pulse {
        from { border-color: var(--signal); box-shadow: 0 0 0 2px rgba(86, 182, 194, 0.35); }
        to { border-color: var(--rule); box-shadow: 0 0 0 0 rgba(86, 182, 194, 0); }
    }

    /* ---------- arrows between the steps ---------- */
    .arw { display: flex; align-items: center; justify-content: center; position: relative; }
    .arw svg { display: block; }
    .arw .down { display: block; }
    .arw .right { display: none; }
    .arw.cross { min-height: 44px; justify-content: flex-start; padding: 6px 0; }
    .arw.cross::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        border-top: 1px dashed var(--ink);
        opacity: 0.55;
    }
    /* stacked layout: the arrow at the left, the label beside it on the dashed line; the label is two
       phrases and wraps between them when the frame is too narrow for one line */
    .arw .cross-t {
        position: relative;
        margin-left: 10px;
        font-family: var(--f-mono);
        font-size: 10.5px;
        line-height: 1.35;
        letter-spacing: 0.06em;
        color: var(--ink);
        background: var(--paper);
        padding: 2px 6px;
        display: block;
    }
    .arw .cross-t span { white-space: nowrap; }
    /* too narrow for one line beside the arrow: two lines, and the box hugs them so the dashed line still shows */
    @media (max-width: 304px) { .arw .cross-t { width: min-content; } }
    .arw:not(.cross) { height: 26px; }

    figure.frame { margin: 0; }

    @media (min-width: 840px) {
        .flow {
            grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr) 24px minmax(0, 1fr) 40px minmax(0, 1fr);
            column-gap: 0;
            row-gap: 6px;
        }
        .thread.lang { grid-row: 1; grid-column: 1 / 6; }
        .thread.eng { grid-row: 1; grid-column: 7; }
        .c1 { grid-row: 2; grid-column: 1; }
        .a1 { grid-row: 2; grid-column: 2; }
        .c2 { grid-row: 2; grid-column: 3; }
        .a2 { grid-row: 2; grid-column: 4; }
        .c3 { grid-row: 2; grid-column: 5; }
        .a3 { grid-row: 2; grid-column: 6; }
        .c4 { grid-row: 2; grid-column: 7; }
        .arw { align-items: flex-start; padding-top: 30px; height: auto !important; min-height: 0 !important; }
        .arw .down { display: none; }
        .arw .right { display: block; }
        .arw.cross { align-items: stretch; padding: 0; }
        .arw.cross::before {
            left: 50%;
            right: auto;
            top: 0;
            bottom: 0;
            border-top: 0;
            border-left: 1px dashed var(--ink);
        }
        .arw.cross .right { position: absolute; left: 0; right: 0; top: 30px; margin: 0 auto; width: 40px; }
        /* set horizontally and turned, not in a vertical writing mode: at this size the vertical
           layout snapped the glyph advances and letters read as other letters */
        .arw .cross-t {
            position: absolute;
            margin: 0;
            transform: translate(-50%, -50%) rotate(-90deg);
            left: 50%;
            top: 62%;
            padding: 3px 10px;
            font-size: 11px;
            line-height: normal;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }
    }

    /* between phone and desktop: each step is text on the left, the worked example on the right */
    @media (min-width: 600px) and (max-width: 839px) {
        .step { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); column-gap: 18px; row-gap: 8px; align-items: start; }
        .step h2 { grid-column: 1 / -1; grid-row: 1; }
        .step .what { grid-column: 1; grid-row: 2; }
        .step .tag { grid-column: 1; grid-row: 3; margin: 0; align-self: end; }
        .step .panel { grid-column: 2; grid-row: 2; }
        .step .note, .step .breakdown { grid-column: 2; grid-row: 3; }
    }

    @media (max-width: 420px) {
        input[type="range"] { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
    }
</style>
</head>
<body>
<figure class="frame fig" id="fig" aria-label="From text to sound in four steps: the line note(&quot;c3 e3&quot;).sound(&quot;saw&quot;) as text, as events in cycles, as voices in seconds, and as blocks of 128 frames.">

    <div class="controls" role="group" aria-label="Tempo and sample rate">
        <div class="ctl">
            <label for="rpm">Tempo</label>
            <input type="range" id="rpm" min="1" max="120" step="1" value="28" aria-describedby="sum">
            <output id="rpmOut" for="rpm">28 rpm</output>
        </div>
        <div class="ctl" role="group" aria-label="Tempo presets">
            <button type="button" class="chip" data-rpm="28" aria-pressed="true">28 (Die Kirschblüte)</button>
            <button type="button" class="chip" data-rpm="30" aria-pressed="false">30 (the app's default)</button>
            <button type="button" class="chip" data-rpm="60" aria-pressed="false">60</button>
        </div>
        <div class="ctl" role="group" aria-label="Sample rate">
            <span class="lab">Sample rate</span>
            <button type="button" class="chip" data-sr="48000" aria-pressed="true">48 kHz</button>
            <button type="button" class="chip" data-sr="44100" aria-pressed="false">44.1 kHz</button>
        </div>
    </div>

    <p class="summary" id="sum" aria-live="polite"><!--R:sum-->At <b>28 rpm</b> the engine plays 28 ÷ 60 = 0.467 cycles per second, so one cycle lasts <b>2.143 s</b>.<!--/R:sum--></p>

    <div class="flow">
        <div class="thread lang" aria-hidden="true">main thread</div>

        <!-- 1 the text -->
        <section class="step c1" aria-labelledby="h1">
            <h2 id="h1"><span class="n" aria-hidden="true">1</span>KlangScript</h2>
            <p class="what">The text as typed. The interpreter runs it and gets a pattern back.</p>
            <div class="panel"><code class="src">note(<span class="st">"c3 e3"</span>)<wbr>.sound(<span class="st">"saw"</span>)</code></div>
            <dl class="breakdown">
                <div><dt>note(<span class="st">"c3 e3"</span>)</dt><dd>two notes, one after the other, filling one cycle</dd></div>
                <div><dt>.sound(<span class="st">"saw"</span>)</dt><dd>the instrument that plays them: a sawtooth</dd></div>
            </dl>
            <p class="tag">Only text so far: no time and no tempo.</p>
        </section>

        <div class="arw a1" aria-hidden="true">
            <svg class="right" width="24" height="12" viewBox="0 0 24 12"><path d="M1,6 L19,6" stroke="#ABB2BF" stroke-width="1.2" fill="none"/><path d="M14,1 L22,6 L14,11" stroke="#ABB2BF" stroke-width="1.2" fill="none"/></svg>
            <svg class="down" width="12" height="26" viewBox="0 0 12 26"><path d="M6,1 L6,21" stroke="#ABB2BF" stroke-width="1.2" fill="none"/><path d="M1,15 L6,23 L11,15" stroke="#ABB2BF" stroke-width="1.2" fill="none"/></svg>
        </div>

        <!-- 2 the pattern -->
        <section class="step c2" aria-labelledby="h2">
            <h2 id="h2"><span class="n" aria-hidden="true">2</span>Pattern</h2>
            <p class="what">Ask sprudel for cycle 0 and two events come back. Time is counted in cycles.</p>
            <div class="panel">
                <svg class="strip" viewBox="0 0 200 58" role="img" aria-label="One cycle on a line from 0 to 1. The first event c3 fills the first half of the cycle, the second event e3 the second half.">
                    <rect class="bar on" x="8.5" y="8" width="90" height="24"/>
                    <rect class="bar on" x="101.5" y="8" width="90" height="24"/>
                    <text class="bar-t" x="16" y="24">c3</text>
                    <text class="bar-t" x="109" y="24">e3</text>
                    <line class="axis" x1="8" y1="40" x2="192" y2="40"/>
                    <line class="tick" x1="8" y1="37" x2="8" y2="43"/>
                    <line class="tick" x1="100" y1="37" x2="100" y2="43"/>
                    <line class="tick" x1="192" y1="37" x2="192" y2="43"/>
                    <text class="tl" x="8" y="54" text-anchor="start">0</text>
                    <text class="tl" x="100" y="54" text-anchor="middle">½</text>
                    <text class="tl" x="192" y="54" text-anchor="end">1 cycle</text>
                </svg>
                <table class="rows" style="margin-top:8px">
                    <thead><tr><th>event</th><th class="r">start</th><th class="r">length</th></tr></thead>
                    <tbody>
                    <tr><td>c3</td><td class="r">0</td><td class="r">½</td></tr>
                    <tr><td>e3</td><td class="r">½</td><td class="r">½</td></tr>
                    </tbody>
                </table>
            </div>
            <p class="tag">Half a cycle is half a cycle at any speed, so nothing here changes with the tempo.</p>
        </section>

        <div class="arw a2" aria-hidden="true">
            <svg class="right" width="24" height="12" viewBox="0 0 24 12"><path d="M1,6 L19,6" stroke="#ABB2BF" stroke-width="1.2" fill="none"/><path d="M14,1 L22,6 L14,11" stroke="#ABB2BF" stroke-width="1.2" fill="none"/></svg>
            <svg class="down" width="12" height="26" viewBox="0 0 12 26"><path d="M6,1 L6,21" stroke="#ABB2BF" stroke-width="1.2" fill="none"/><path d="M1,15 L6,23 L11,15" stroke="#ABB2BF" stroke-width="1.2" fill="none"/></svg>
        </div>

        <!-- 3 the wire -->
        <section class="step c3" id="step3" aria-labelledby="h3">
            <h2 id="h3"><span class="n" aria-hidden="true">3</span>The wire</h2>
            <p class="what">The scheduler applies the tempo and sends each event as a <code class="src">ScheduledVoice</code>, in seconds.</p>
            <div class="panel live">
                <div id="r-strip3"><!--R:strip3--><svg class="strip" viewBox="0 0 200 58" role="img" aria-label="A ruler from 0 to 6 seconds. At 28 rpm one cycle lasts 2.143 seconds, so c3 lasts 1.071 seconds and e3 the same. The pattern repeats in every following cycle."><rect class="bar on" x="8.5" y="8" width="31.86" height="24"/><text class="bar-t" x="15" y="24">c3</text><rect class="bar on" x="41.36" y="8" width="31.86" height="24"/><text class="bar-t" x="47.86" y="24">e3</text><rect class="bar off" x="74.21" y="8" width="31.86" height="24"/><rect class="bar off" x="107.07" y="8" width="31.86" height="24"/><rect class="bar off" x="139.93" y="8" width="31.86" height="24"/><rect class="bar off" x="172.79" y="8" width="18.71" height="24"/><line class="cyc" x1="73.71" y1="4" x2="73.71" y2="37"/><line class="cyc" x1="139.43" y1="4" x2="139.43" y2="37"/><line class="axis" x1="8" y1="40" x2="192" y2="40"/><line class="tick" x1="8" y1="37" x2="8" y2="43"/><text class="tl" x="8" y="54" text-anchor="start">0</text><line class="tick" x1="38.67" y1="37" x2="38.67" y2="43"/><text class="tl" x="38.67" y="54" text-anchor="middle">1</text><line class="tick" x1="69.33" y1="37" x2="69.33" y2="43"/><text class="tl" x="69.33" y="54" text-anchor="middle">2</text><line class="tick" x1="100" y1="37" x2="100" y2="43"/><text class="tl" x="100" y="54" text-anchor="middle">3</text><line class="tick" x1="130.67" y1="37" x2="130.67" y2="43"/><text class="tl" x="130.67" y="54" text-anchor="middle">4</text><line class="tick" x1="161.33" y1="37" x2="161.33" y2="43"/><text class="tl" x="161.33" y="54" text-anchor="middle">5</text><line class="tick" x1="192" y1="37" x2="192" y2="43"/><text class="tl" x="192" y="54" text-anchor="end">6 s</text></svg><!--/R:strip3--></div>
                <div class="kv" id="r-kv3" style="margin-top:8px"><!--R:kv3--><div class="g">c3</div><div class="row"><span>startTime</span><span>0.000 <i class="u">s</i></span></div><div class="row"><span>gateEndTime</span><span>1.071 <i class="u">s</i></span></div><div class="g">e3</div><div class="row"><span>startTime</span><span>1.071 <i class="u">s</i></span></div><div class="row"><span>gateEndTime</span><span>2.143 <i class="u">s</i></span></div><!--/R:kv3--></div>
            </div>
            <p class="note" id="r-note3"><!--R:note3-->seconds = cycles × 60 ÷ 28<br>Each voice also carries its data: <b>note</b> "c3", <b>freqHz</b> 130.81, <b>sound</b> "saw".<!--/R:note3--></p>
            <p class="tag hot">Our line does not ask for the tempo. The scheduler applies it here.</p>
        </section>

        <div class="arw cross a3" aria-hidden="true">
            <svg class="right" width="40" height="12" viewBox="0 0 40 12"><path d="M1,6 L35,6" stroke="#ABB2BF" stroke-width="1.2" fill="none"/><path d="M30,1 L38,6 L30,11" stroke="#ABB2BF" stroke-width="1.2" fill="none"/></svg>
            <svg class="down" width="12" height="26" viewBox="0 0 12 26" style="position:relative"><path d="M6,1 L6,21" stroke="#ABB2BF" stroke-width="1.2" fill="none"/><path d="M1,15 L6,23 L11,15" stroke="#ABB2BF" stroke-width="1.2" fill="none"/></svg>
            <span class="cross-t"><span>messages to the audio worklet,</span> <span>seconds only</span></span>
        </div>

        <div class="thread eng" aria-hidden="true">audio thread</div>

        <!-- 4 the Motor -->
        <section class="step eng c4" aria-labelledby="h4">
            <h2 id="h4"><span class="n" aria-hidden="true">4</span>The Motor</h2>
            <p class="what">The engine knows seconds only. It turns them into frames and renders 128 frames per block.</p>
            <div class="panel live">
                <svg class="strip" viewBox="0 0 200 58" role="img" aria-label="A row of blocks numbered 0, 1, 2 and so on, each 128 frames long.">
                    <path class="dim" d="M8.5,17 L8.5,12 L32.5,12 L32.5,17"/>
                    <rect class="cell" x="8.5" y="20" width="24" height="24"/>
                    <rect class="cell" x="36.5" y="20" width="24" height="24"/>
                    <rect class="cell" x="64.5" y="20" width="24" height="24"/>
                    <rect class="cell" x="120.5" y="20" width="24" height="24"/>
                    <rect class="cell" x="148.5" y="20" width="24" height="24"/>
                    <text class="cell-t" x="20.5" y="36">0</text>
                    <text class="cell-t" x="48.5" y="36">1</text>
                    <text class="cell-t" x="76.5" y="36">2</text>
                    <text class="cell-t" x="132.5" y="36">n</text>
                    <text class="cell-t" x="160.5" y="36">n+1</text>
                    <circle cx="98" cy="32" r="1.5" fill="#D19A66"/><circle cx="104" cy="32" r="1.5" fill="#D19A66"/><circle cx="110" cy="32" r="1.5" fill="#D19A66"/>
                    <path d="M176,32 L190,32 M185,27 L191,32 L185,37" stroke="#D19A66" stroke-width="1.2" fill="none"/>
                    <text class="dim-t" x="8.5" y="8" style="text-anchor:start">128 frames</text>
                    <text class="tl" x="8" y="54" text-anchor="start">block</text>
                    <text class="tl" x="192" y="54" text-anchor="end">to the speakers</text>
                </svg>
                <div class="kv" id="r-kv4" style="margin-top:8px"><!--R:kv4--><div class="g">c3</div><div class="row"><span>start frame</span><span>0</span></div><div class="row"><span>gate</span><span>401.8 <i class="u">blocks</i></span></div><div class="g">e3</div><div class="row"><span>start frame</span><span>51,428</span></div><div class="row"><span>gate</span><span>401.8 <i class="u">blocks</i></span></div><!--/R:kv4--></div>
            </div>
            <p class="note" id="r-note4"><!--R:note4-->One block is 128 frames, <b>2.667&nbsp;ms</b> at 48&nbsp;kHz. The gate is how long the note is held: about <b>402</b> blocks for each of ours.<!--/R:note4--></p>
            <p class="tag">The seconds from step 3 are all this step is given, so its numbers follow them.</p>
        </section>
    </div>
</figure>

<script>
(function () {
    "use strict";

    // ---- the running example: note("c3 e3").sound("saw") ------------------------------------------
    // Two events in cycle 0: c3 at 0 for 1/2 a cycle, e3 at 1/2 for 1/2 a cycle (a two-step sequence
    // splits the cycle equally: SequencePattern in sprudel). freqHz from Tones.noteToFreq: c3 is MIDI 48
    // and e3 is MIDI 52, 440 * 2^((m - 69) / 12).
    var EVENTS = [
        { name: "c3", freq: 440 * Math.pow(2, (48 - 69) / 12), startCycles: 0.0, durationCycles: 0.5 },
        { name: "e3", freq: 440 * Math.pow(2, (52 - 69) / 12), startCycles: 0.5, durationCycles: 0.5 }
    ];
    var BLOCK_FRAMES = 128;   // AudioBackendContext.RENDER_QUANTUM_FRAMES
    var RULER_SECONDS = 6;    // this figure's ruler, a drawing choice

    // The same arithmetic as KlangPatternScheduler.queryEvents and VoiceFactory.makeVoice, in the same order:
    // cps = rpm / 60, secPerCycle = 1 / cps, startTime = startCycles * secPerCycle,
    // gateEndTime = startTime + durationCycles * secPerCycle, startFrame = floor(startTime * sampleRate).
    function model(rpm, sampleRate) {
        var cps = rpm / 60.0;
        var secPerCycle = 1.0 / cps;
        var voices = EVENTS.map(function (e) {
            var start = e.startCycles * secPerCycle;
            var duration = e.durationCycles * secPerCycle;
            var gateEnd = start + duration;
            var startFrame = Math.floor(start * sampleRate);
            var gateEndFrame = Math.floor(gateEnd * sampleRate);
            var gateFrames = gateEndFrame - startFrame;
            return {
                name: e.name, freq: e.freq, start: start, gateEnd: gateEnd,
                startFrame: startFrame, gateFrames: gateFrames, gateBlocks: gateFrames / BLOCK_FRAMES
            };
        });
        return { rpm: rpm, sampleRate: sampleRate, cps: cps, secPerCycle: secPerCycle, voices: voices,
                 blockMs: BLOCK_FRAMES / sampleRate * 1000.0 };
    }

    function r2(n) { return Math.round(n * 100) / 100; }
    function fixed(n, d) { return n.toFixed(d); }
    function int(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
    // Blocks with one decimal while small, whole numbers with separators once they are thousands.
    function blocks(n) { return n >= 1000 ? int(n) : fixed(n, 1); }
    function khz(sr) { return (sr / 1000).toString().replace(/\.0+$/, ""); }

    // ---- regions ------------------------------------------------------------------------------------
    function strip3(m) {
        var W = 200, L = 8, R = 8, y0 = 8, h = 24;
        var sx = (W - L - R) / RULER_SECONDS;
        var s = "";
        var half = m.secPerCycle / 2;
        var cycles = Math.min(Math.ceil(RULER_SECONDS / m.secPerCycle), 40);
        var k, i, a, b, x, w, on;
        for (k = 0; k < cycles; k++) {
            for (i = 0; i < 2; i++) {
                a = k * m.secPerCycle + i * half;
                b = a + half;
                if (a >= RULER_SECONDS) { break; }
                b = Math.min(b, RULER_SECONDS);
                x = L + a * sx;
                w = (b - a) * sx;
                on = k === 0;
                s += '<rect class="bar ' + (on ? "on" : "off") + '" x="' + r2(x + 0.5) + '" y="' + y0 + '" width="' + r2(Math.max(w - 1, 0.5)) + '" height="' + h + '"/>';
                if (on && w >= 22) {
                    s += '<text class="bar-t" x="' + r2(x + 7) + '" y="24">' + EVENTS[i].name + "</text>";
                }
            }
        }
        for (k = 1; k < cycles; k++) {
            x = L + k * m.secPerCycle * sx;
            if (x < W - R) { s += '<line class="cyc" x1="' + r2(x) + '" y1="4" x2="' + r2(x) + '" y2="37"/>'; }
        }
        s += '<line class="axis" x1="' + L + '" y1="40" x2="' + (W - R) + '" y2="40"/>';
        for (i = 0; i <= RULER_SECONDS; i++) {
            x = L + i * sx;
            s += '<line class="tick" x1="' + r2(x) + '" y1="37" x2="' + r2(x) + '" y2="43"/>';
            s += '<text class="tl" x="' + r2(x) + '" y="54" text-anchor="' + (i === 0 ? "start" : i === RULER_SECONDS ? "end" : "middle") + '">' + i + (i === RULER_SECONDS ? " s" : "") + "</text>";
        }
        if (half > RULER_SECONDS) {
            s += '<path d="M180,32 L190,32 M185,27 L191,32 L185,37" stroke="#0f1013" stroke-width="1.4" fill="none"/>';
        }
        var label = "A ruler from 0 to " + RULER_SECONDS + " seconds. At " + m.rpm + " rpm one cycle lasts " + fixed(m.secPerCycle, 3) +
            " seconds, so c3 lasts " + fixed(half, 3) + " seconds and e3 the same. The pattern repeats in every following cycle.";
        return '<svg class="strip" viewBox="0 0 ' + W + ' 58" role="img" aria-label="' + label + '">' + s + "</svg>";
    }

    function kv(groups) {
        return groups.map(function (g) {
            return '<div class="g">' + g.name + "</div>" + g.rows.map(function (r) {
                return '<div class="row"><span>' + r[0] + '</span><span>' + r[1] + (r[2] ? ' <i class="u">' + r[2] + "</i>" : "") + "</span></div>";
            }).join("");
        }).join("");
    }

    function kv3(m) {
        return kv(m.voices.map(function (v) {
            return { name: v.name, rows: [["startTime", fixed(v.start, 3), "s"], ["gateEndTime", fixed(v.gateEnd, 3), "s"]] };
        }));
    }

    function note3(m) {
        return "seconds = cycles × 60 ÷ " + m.rpm + "<br>Each voice also carries its data: <b>note</b> \"c3\", <b>freqHz</b> " +
            fixed(m.voices[0].freq, 2) + ", <b>sound</b> \"saw\".";
    }

    function kv4(m) {
        return kv(m.voices.map(function (v) {
            return { name: v.name, rows: [["start frame", int(v.startFrame), ""], ["gate", blocks(v.gateBlocks), "blocks"]] };
        }));
    }

    function note4(m) {
        return "One block is 128 frames, <b>" + fixed(m.blockMs, 3) + "&nbsp;ms</b> at " + khz(m.sampleRate) + "&nbsp;kHz. The gate is how long the note is held: about <b>" +
            int(m.voices[0].gateBlocks) + "</b> blocks for each of ours.";
    }

    function sum(m) {
        return "At <b>" + m.rpm + " rpm</b> the engine plays " + m.rpm + " ÷ 60 = " + fixed(m.cps, 3) + " cycles per second, so one cycle lasts <b>" +
            fixed(m.secPerCycle, 3) + " s</b>.";
    }

    function regions(m) {
        return { sum: sum(m), strip3: strip3(m), kv3: kv3(m), note3: note3(m), kv4: kv4(m), note4: note4(m) };
    }

    // For the static build (a node script fills the no-JavaScript state from this same code).
    if (typeof window !== "undefined" && window.__BUILD) {
        window.__regions = function () { return regions(model(28, 48000)); };
        return;
    }

    // ---- wiring -------------------------------------------------------------------------------------
    document.documentElement.className = document.documentElement.className.replace("no-js", "js");

    var state = { rpm: 28, sampleRate: 48000 };
    var rpmInput = document.getElementById("rpm");
    var rpmOut = document.getElementById("rpmOut");
    var step3 = document.getElementById("step3");
    var pulseTimer = 0;

    function put(id, html) {
        var el = document.getElementById(id);
        if (el) { el.innerHTML = html; }
    }

    function apply(pulse) {
        var m = model(state.rpm, state.sampleRate);
        var r = regions(m);
        put("sum", r.sum);
        put("r-strip3", r.strip3);
        put("r-kv3", r.kv3);
        put("r-note3", r.note3);
        put("r-kv4", r.kv4);
        put("r-note4", r.note4);
        rpmOut.textContent = state.rpm + " rpm";
        rpmInput.setAttribute("aria-valuetext", state.rpm + " revolutions per minute");
        rpmInput.value = String(state.rpm);
        var chips = document.querySelectorAll("[data-rpm]");
        for (var i = 0; i < chips.length; i++) {
            chips[i].setAttribute("aria-pressed", String(Number(chips[i].getAttribute("data-rpm")) === state.rpm));
        }
        var srs = document.querySelectorAll("[data-sr]");
        for (var j = 0; j < srs.length; j++) {
            srs[j].setAttribute("aria-pressed", String(Number(srs[j].getAttribute("data-sr")) === state.sampleRate));
        }
        if (pulse) {
            var cards = document.querySelectorAll(".step.c3, .step.c4");
            for (var c = 0; c < cards.length; c++) { cards[c].classList.remove("pulse"); }
            void step3.offsetWidth;
            for (var d = 0; d < cards.length; d++) { cards[d].classList.add("pulse"); }
        }
    }

    function clampRpm(v) {
        v = Math.round(Number(v));
        if (!isFinite(v)) { v = 28; }
        return Math.min(120, Math.max(1, v));
    }

    rpmInput.addEventListener("input", function () {
        state.rpm = clampRpm(rpmInput.value);
        apply(true);
    });

    document.addEventListener("click", function (ev) {
        var t = ev.target;
        while (t && t !== document && !(t.getAttribute && (t.getAttribute("data-rpm") || t.getAttribute("data-sr")))) { t = t.parentNode; }
        if (!t || t === document) { return; }
        if (t.getAttribute("data-rpm")) { state.rpm = clampRpm(t.getAttribute("data-rpm")); apply(true); }
        if (t.getAttribute("data-sr")) { state.sampleRate = Number(t.getAttribute("data-sr")); apply(true); }
    });

    apply(false);

    // ---- height reporting ---------------------------------------------------------------------------
    function report() {
        var h = Math.ceil(document.body.getBoundingClientRect().height);
        try { window.parent.postMessage({ type: "klang-figure-height", height: h }, "*"); } catch (e) { /* no parent */ }
    }
    window.addEventListener("load", report);
    window.addEventListener("resize", report);
    if (window.ResizeObserver) { new ResizeObserver(report).observe(document.body); }
    report();
})();
</script>
</body>
</html>
